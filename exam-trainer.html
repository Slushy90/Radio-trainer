<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Radio Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single centred exam column, one question card at a time, a sticky status strip like an exam-room clock */
:root{
  --bg:#eef1f2; --surface:#ffffff; --ink:#15232b; --muted:#5b6b73; --line:#cfd8dc;
  --accent:#0d6e7a; --accent-ink:#ffffff; --amber:#b86a00;
  --ok:#1f7a3f; --ok-bg:#e3f3e8; --bad:#b0322b; --bad-bg:#fbe6e4;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#16222a; --ink:#e3ebee; --muted:#93a4ab; --line:#2a3a43;
  --accent:#3fb3c0; --accent-ink:#06191d; --amber:#e8a33a;
  --ok:#5fcf86; --ok-bg:#15301f; --bad:#f07a70; --bad-bg:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#16222a; --ink:#e3ebee; --muted:#93a4ab; --line:#2a3a43;
  --accent:#3fb3c0; --accent-ink:#06191d; --amber:#e8a33a;
  --ok:#5fcf86; --ok-bg:#15301f; --bad:#f07a70; --bad-bg:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2.1rem}
h2{font-size:1.5rem}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.lede{color:var(--muted);margin:0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modes{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.modes{grid-template-columns:repeat(3,1fr)}.modes.two{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;align-self:flex-start;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.segb{all:unset;cursor:pointer;padding:7px 16px;border-radius:999px;font:700 .92rem var(--f-body);color:var(--muted)}
.segb:hover{color:var(--ink)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.segb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode b{font:700 1.3rem var(--f-display)}
.mode span{color:var(--muted);font-size:.93rem}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font:500 .85rem var(--f-mono);color:var(--muted)}
.facts strong{color:var(--ink)}
label{font-weight:700;font-size:.9rem}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 1rem var(--f-body);padding:11px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.clock.low{color:var(--bad)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.topic{font:500 .78rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q{font-size:1.15rem;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{font:500 .95rem var(--f-mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[aria-disabled="true"]{cursor:default}
.explain{border-left:3px solid var(--accent);padding:6px 0 6px 12px;color:var(--ink);font-size:.95rem}
.explain b{color:var(--accent)}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.dot{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);font:500 .78rem var(--f-mono)}
.dot.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot.cur{outline:2px solid var(--amber);outline-offset:1px}
.score{font:700 3.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.verdict{display:inline-block;font:700 .85rem var(--f-mono);letter-spacing:.08em;padding:4px 10px;border-radius:999px}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font:500 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{text-align:right;white-space:nowrap}
.review{display:flex;flex-direction:column;gap:14px}
.ritem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.ritem .you{color:var(--bad)} .ritem .ans{color:var(--ok)}
.note{font-size:.82rem;color:var(--muted);margin:0}
.fig{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center}
.fig img{max-width:100%;max-height:320px;height:auto}
.ref{max-height:60vh;overflow-y:auto;scroll-margin-top:64px}
.tw{overflow-x:auto}
#ref[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
// ---------- Question bank (original questions written for the 2024+ syllabus) ----------
let T={L:"Licence conditions",O:"Operating practice",S:"Safety",E:"EMC",TE:"Technical basics",TR:"Transmitters & receivers",A:"Feeders & antennas",P:"Propagation",G:"General radio knowledge"};
let Q=[
// Licence (6 in exam)
{t:"L",q:"What is the maximum transmit power for a Foundation licensee on most bands?",o:["10 W","25 W","50 W","100 W"],a:1,e:"Since the February 2024 licence changes, Foundation holders may use up to 25 W on most bands (Intermediate 100 W, Full 1 kW)."},
{t:"L",q:"A newly issued Foundation callsign in England will begin with:",o:["M3","M6","M7","2E0"],a:2,e:"New Foundation callsigns are issued in the M7 series. M3 and M6 are older Foundation series; 2E0 is Intermediate."},
{t:"L",q:"A Foundation licensee with callsign M7ABC is operating from their main address in Scotland. Which form may they use?",o:["MS7ABC","MM7ABC","GM7ABC","M7ABC/S"],a:1,e:"The Regional Secondary Locator for Scotland is M, inserted after the first letter: MM7ABC. Since 2024 RSLs are optional for Foundation, so plain M7ABC is also allowed."},
{t:"L",q:"Which Regional Secondary Locator indicates Wales?",o:["W","G","I","D"],a:0,e:"W = Wales. M = Scotland, I = Northern Ireland, D = Isle of Man, J = Jersey, U = Guernsey, and E (optional) = England."},
{t:"L",q:"How often must you give your callsign during a contact?",o:["Only at the start","At the start, the end, and at least every 15 minutes","Every 5 minutes","Only when asked"],a:1,e:"Identify at the beginning and end of each transmission period and at intervals of no more than 15 minutes."},
{t:"L",q:"Which of these may you NOT transmit on the amateur bands?",o:["Your callsign in Morse","Messages about your station equipment","Music or entertainment broadcasts","Weather conditions at your location"],a:2,e:"Amateur radio is for self-training and communication between amateurs. Broadcasting music or entertainment is not permitted."},
{t:"L",q:"May you use codes or encryption to hide the meaning of your messages?",o:["Yes, on digital modes","Yes, if the other station agrees","No, except for internationally recognised abbreviations such as Q-codes","Only on bands above 1 GHz"],a:2,e:"Messages must not be encrypted to obscure their meaning. Q-codes and standard abbreviations are allowed because their meaning is public."},
{t:"L",q:"Who can require you to close down your station?",o:["Any neighbour","A person authorised by Ofcom","The RSGB","Any other licensed amateur"],a:1,e:"A person authorised by Ofcom may require you to reduce power, stop transmitting or close down."},
{t:"L",q:"How often must a UK amateur licence be revalidated with Ofcom?",o:["Every year","Every 3 years","At least every 5 years","Never"],a:2,e:"The licence is free and lasts for life, but you must confirm (revalidate) your details at least every five years."},
{t:"L",q:"You move house. What must you do about your licence?",o:["Nothing","Tell Ofcom of your new address","Retake the exam","Apply for a new callsign"],a:1,e:"You must keep your licence details up to date, including your main station address."},
{t:"L",q:"Which change in 2024 allows Foundation licensees to do something new with equipment?",o:["Use 1 kW on HF","Build their own transmitters and kits","Operate without a callsign","Use unlicensed frequencies"],a:1,e:"Foundation holders may now build and use their own transmitting equipment, not only commercially made gear."},
{t:"L",q:"What does the suffix /MM after a callsign indicate?",o:["Mobile in a vehicle","Maritime mobile, on a vessel at sea","Main station","Multiple operators"],a:1,e:"/M = mobile (land vehicle), /P = portable, /MM = maritime mobile."},
{t:"L",q:"An unlicensed person wants to talk on your radio. Under what condition can this happen?",o:["Never","Only if they hold a CB licence","When they are directly supervised by you and you are responsible for the station","Only on 70 cm"],a:2,e:"Unlicensed people may pass messages under the direct supervision of the licensee, who stays responsible and gives the callsign."},
{t:"L",q:"Your licence requires you to protect people from RF exposure. What must you do above the threshold power?",o:["Nothing — amateurs are exempt","Carry out and keep an EMF exposure assessment","Register the antenna with the council","Use only vertical antennas"],a:1,e:"Ofcom's EMF conditions require an assessment showing the public are not exposed above the limits, for stations above 10 W EIRP. Ofcom provides a calculator."},
// Operating (6ish)
{t:"O",q:"What is the first thing to do before calling CQ on a frequency?",o:["Transmit a carrier to tune up","Listen, then ask if the frequency is in use","Turn power to maximum","Call the strongest station you hear"],a:1,e:"Listen first, then ask \"Is this frequency in use?\" so you don't interfere with a contact you can't hear well."},
{t:"O",q:"What does the Q-code QTH mean?",o:["My location","Interference from other stations","I will change frequency","I confirm receipt"],a:0,e:"QTH = location. QRM = man-made interference, QRN = natural noise, QSY = change frequency, QSL = confirm receipt."},
{t:"O",q:"What does QRP mean?",o:["Reduce power / low-power operation","Who is calling me?","Signals are fading","Stop sending"],a:0,e:"QRP = reduce power; it is also used for low-power operating (typically 5 W or less)."},
{t:"O",q:"Which Q-code means \"Who is calling me?\"",o:["QRZ?","QSO?","QSB?","QRT?"],a:0,e:"QRZ? asks who is calling. QSO = a contact, QSB = fading, QRT = stop transmitting / closing down."},
{t:"O",q:"A signal report of \"5 and 9\" means:",o:["Weak and hard to copy","Perfectly readable, extremely strong","Readable with difficulty, fairly good strength","Distorted audio"],a:1,e:"RS(T): Readability 1–5, Strength 1–9. 59 is fully readable and very strong. CW adds a Tone figure, e.g. 599."},
{t:"O",q:"How is the callsign M7ABC spoken using the phonetic alphabet?",o:["Mike Seven Alpha Bravo Charlie","Mary Seven Able Baker Charlie","Mike Seven Alfa Beta Charlie","Mexico Seven Alpha Bravo Charlie"],a:0,e:"ITU phonetics: Mike, Alpha (Alfa), Bravo, Charlie."},
{t:"O",q:"What is the 2 m FM simplex calling frequency in the UK?",o:["144.300 MHz","145.500 MHz","145.800 MHz","433.500 MHz"],a:1,e:"145.500 MHz is the 2 m FM calling channel. 144.300 is the 2 m SSB centre of activity; 433.500 is the 70 cm FM calling channel."},
{t:"O",q:"Which sideband is conventionally used for SSB voice on 7 MHz (40 m)?",o:["USB","LSB","Either, there is no convention","DSB"],a:1,e:"Convention: LSB below 10 MHz (160, 80, 40 m), USB above 10 MHz (20 m and up, and VHF/UHF)."},
{t:"O",q:"Where on most HF bands will you find CW (Morse) activity?",o:["At the top of the band","In the middle","At the bottom of the band","Anywhere"],a:2,e:"Band plans put CW and narrow modes at the low end, with SSB phone higher up. Check the band plan (provided in the exam reference booklet)."},
{t:"O",q:"A repeater is described as needing a CTCSS tone. What is this for?",o:["To increase the repeater's range","A sub-audible tone that opens the repeater's receiver","To encrypt your voice","To set the repeater's clock"],a:1,e:"CTCSS is a low-frequency tone sent with your audio so the repeater only responds to stations that intend to use it."},
{t:"O",q:"On 2 m, what is the usual offset between a repeater's input and output frequencies?",o:["100 kHz","600 kHz","1.6 MHz","7.6 MHz"],a:1,e:"UK 2 m repeaters use a 600 kHz shift: you transmit 600 kHz below the repeater's output."},
{t:"O",q:"Why should you pause between overs when using a repeater?",o:["To let the battery recover","So other stations can break in, for example with an emergency","To save power","It resets the CTCSS tone"],a:1,e:"Leaving a gap lets others join or pass urgent traffic."},
{t:"O",q:"What is a QSL card?",o:["A licence document","Written confirmation of a contact","A band plan","A repeater access card"],a:1,e:"QSL cards (paper or electronic) confirm that a contact took place, and are used for awards."},
{t:"O",q:"FT8 is best described as:",o:["A narrow-band digital mode for weak signals","A wideband FM voice mode","A Morse key type","A repeater linking system"],a:0,e:"FT8 is a computer-based digital mode that decodes signals well below what a human could hear."},
// Safety
{t:"S",q:"What fuse would suit a mains plug feeding a 230 V power supply drawing about 1.5 A?",o:["1 A","3 A","13 A","30 A"],a:1,e:"Choose a fuse just above the normal current. 3 A gives margin over 1.5 A while still protecting the flex."},
{t:"S",q:"Where should an antenna NOT be installed?",o:["Near overhead power lines","On a garage roof","In the loft","Along a garden fence"],a:0,e:"Keep antennas well clear of power lines: if one falls onto or touches a line it can be fatal."},
{t:"S",q:"A station's RF earth rod and a PME (protective multiple earthing) house supply:",o:["Should always be bonded together without checking","Can create a hazard; get advice before connecting","Are the same thing","Only matter on VHF"],a:1,e:"With PME, faults can raise the house earth voltage. Connecting an outside RF earth without care can create a shock hazard, so seek advice."},
{t:"S",q:"Why should you charge a lead-acid battery in a ventilated area?",o:["It gives off hydrogen, which is explosive","It needs cooling to hold charge","To reduce RF noise","It is not necessary"],a:0,e:"Charging lead-acid batteries releases hydrogen gas, which can ignite."},
{t:"S",q:"In the shack, where should the main mains switch-off be?",o:["Behind the equipment","Clearly marked and easy to reach, known to the household","In another room, locked","Inside the PSU case"],a:1,e:"An obvious, reachable master switch lets anyone cut power quickly in an emergency."},
{t:"S",q:"Why should feeder cables not trail across the floor?",o:["They pick up hum","Tripping hazard","They lose more power","It voids the licence"],a:1,e:"Trailing cables are a trip hazard and can pull equipment off desks."},
{t:"S",q:"What is the main risk of touching an antenna element while transmitting?",o:["Static shock only","RF burns","It detunes the receiver","No risk at 25 W"],a:1,e:"High RF voltages exist on antenna elements, especially at ends, and can cause painful burns even at modest power."},
// EMC
{t:"E",q:"A neighbour's TV is affected only when you transmit. What should you do first?",o:["Ignore it","Check your own station for faults and good practice, and be helpful","Tell them to buy a new TV","Increase power so you get through"],a:1,e:"Start by checking your own station (harmonics, SWR, feeder, earthing) and handle it politely. Then look at the receiving installation."},
{t:"E",q:"A ferrite ring with several turns of cable wound on it is used to:",o:["Increase transmitter power","Reduce unwanted RF currents on the cable","Store energy","Measure SWR"],a:1,e:"Ferrite chokes add impedance to RF on the outside of cables, reducing breakthrough into nearby equipment."},
{t:"E",q:"Which antenna position is likely to cause the least interference to household electronics?",o:["In the loft right above the TV","As high and as far from the house as practical","Along the house wiring","Inside the shack"],a:1,e:"Distance reduces field strength. Getting the antenna up and away from house wiring helps both transmit EMC and receive noise."},
{t:"E",q:"A low-pass filter after an HF transmitter helps reduce:",o:["Received noise","Harmonics radiated on higher frequencies","Mains hum","SWR"],a:1,e:"Harmonics are multiples of the wanted frequency. A low-pass filter passes HF and attenuates higher frequencies, such as those used by TV and FM."},
{t:"E",q:"Your signal on 7.1 MHz is also heard on 14.2 MHz. This is:",o:["A repeater","The second harmonic","Image interference","Normal sideband"],a:1,e:"14.2 MHz = 2 × 7.1 MHz, the second harmonic. A properly working transmitter and filter keep it very low."},
{t:"E",q:"What can cause \"splatter\" on SSB, spreading your signal outside its normal bandwidth?",o:["Too much microphone gain or overdriving","Using a dipole","Low SWR","A good earth"],a:0,e:"Overdriving causes distortion products that widen the signal and can interfere with nearby stations."},
// Technical basics
{t:"TE",q:"A 12 V supply drives 2 A through a load. What power is used?",o:["6 W","10 W","14 W","24 W"],a:3,e:"P = V × I = 12 × 2 = 24 W."},
{t:"TE",q:"What current flows through a 6 Ω resistor connected to 12 V?",o:["0.5 A","2 A","6 A","72 A"],a:1,e:"Ohm's law: I = V / R = 12 / 6 = 2 A."},
{t:"TE",q:"Two 100 Ω resistors are connected in series. Total resistance?",o:["50 Ω","100 Ω","200 Ω","10 kΩ"],a:2,e:"In series, resistances add: 100 + 100 = 200 Ω. In parallel, two equal resistors give half: 50 Ω."},
{t:"TE",q:"The unit of frequency is the:",o:["Ohm","Hertz","Farad","Watt"],a:1,e:"Hertz (Hz) = cycles per second. 1 MHz = 1,000 kHz = 1,000,000 Hz."},
{t:"TE",q:"Which formula links wavelength (m) and frequency (MHz)?",o:["λ = 300 × f","λ = 300 / f","λ = f / 300","λ = 3 / f"],a:1,e:"λ (metres) = 300 / f (MHz). The exam reference booklet also has a conversion chart."},
{t:"TE",q:"Approximately what wavelength is 145 MHz?",o:["20 m","6 m","2 m","70 cm"],a:2,e:"300 / 145 ≈ 2.07 m, which is why it is called the 2 m band."},
{t:"TE",q:"Approximately what wavelength is 7 MHz?",o:["4 m","40 m","80 m","400 m"],a:1,e:"300 / 7 ≈ 43 m, the 40 m band."},
{t:"TE",q:"Which band is around 435 MHz?",o:["2 m","6 m","23 cm","70 cm"],a:3,e:"300 / 435 ≈ 0.69 m, the 70 cm band."},
{t:"TE",q:"A battery is rated 2000 mAh. Roughly how long will it supply 500 mA?",o:["2 hours","4 hours","10 hours","40 hours"],a:1,e:"2000 mAh ÷ 500 mA = 4 hours (ideally)."},
{t:"TE",q:"A diode is a component that:",o:["Stores charge","Lets current flow in one direction only","Increases voltage","Opposes all current equally"],a:1,e:"A diode conducts one way, which is used for rectifying AC into DC and for protection against reverse polarity."},
{t:"TE",q:"Which component is measured in farads and stores electric charge?",o:["Resistor","Inductor","Capacitor","Diode"],a:2,e:"Capacitors store charge and are measured in farads (usually µF, nF, pF)."},
{t:"TE",q:"An increase of 3 dB in power is roughly:",o:["No change","Doubling","Ten times","Halving"],a:1,e:"+3 dB ≈ ×2, +10 dB = ×10, −3 dB ≈ half. The reference booklet has a dB table."},
{t:"TE",q:"Which material is a good electrical insulator?",o:["Copper","Aluminium","Plastic (PVC)","Salt water"],a:2,e:"Plastics, glass and ceramics are insulators; metals conduct."},
// Transmitters & receivers
{t:"TR",q:"In a transmitter, what does the oscillator do?",o:["Amplifies audio","Generates the radio-frequency signal","Filters harmonics","Matches the antenna"],a:1,e:"The oscillator generates the RF; it is then modulated and amplified."},
{t:"TR",q:"Which mode varies the frequency of the carrier with the audio?",o:["AM","FM","SSB","CW"],a:1,e:"FM = frequency modulation. AM varies amplitude; SSB is a form of AM with the carrier and one sideband removed; CW switches a carrier on and off."},
{t:"TR",q:"Which mode uses the narrowest bandwidth?",o:["FM voice","AM voice","SSB voice","CW"],a:3,e:"CW occupies only a few hundred hertz or less. SSB ≈ 3 kHz, AM ≈ 6 kHz, FM voice ≈ 10–12 kHz."},
{t:"TR",q:"What does a receiver's squelch control do?",o:["Changes frequency","Mutes the audio when no signal is present","Increases transmit power","Selects sideband"],a:1,e:"Squelch silences background noise until a signal strong enough to open it arrives. It is most used on FM."},
{t:"TR",q:"Selectivity of a receiver describes its ability to:",o:["Hear very weak signals","Separate a wanted signal from nearby ones","Reduce mains hum","Display frequency"],a:1,e:"Selectivity = rejecting adjacent signals (filters). Sensitivity = hearing weak signals."},
{t:"TR",q:"What does AGC (automatic gain control) do?",o:["Keeps audio output level fairly constant as signal strength changes","Tunes the antenna","Sets transmit power","Reduces SWR"],a:0,e:"AGC turns the receiver's gain down on strong signals and up on weak ones."},
{t:"TR",q:"Why use a dummy load when adjusting a transmitter?",o:["It increases range","It absorbs power without radiating, so you cause no interference","It improves reception","It's a legal requirement for all transmissions"],a:1,e:"A dummy load is a non-radiating 50 Ω resistor that safely absorbs the transmitter's output for testing."},
{t:"TR",q:"In a superhet receiver, the mixer converts incoming signals to:",o:["Audio directly","A fixed intermediate frequency (IF)","A higher power","Direct current"],a:1,e:"The mixer combines the incoming signal with a local oscillator to produce a fixed IF, where most filtering and gain happen."},
// Feeders & antennas
{t:"A",q:"What is the typical impedance of the coaxial cable used for amateur transceivers?",o:["50 Ω","75 Ω","300 Ω","600 Ω"],a:0,e:"Most amateur rigs and coax (RG58, RG213) are 50 Ω. TV coax is typically 75 Ω."},
{t:"A",q:"Compared with RG58, a thicker coax such as RG213 generally has:",o:["Higher loss","Lower loss","The same loss","No shield"],a:1,e:"Thicker coax has lower loss, especially at VHF/UHF. Loss increases with frequency and with cable length."},
{t:"A",q:"Roughly how long is a half-wave dipole for 14.2 MHz?",o:["2.5 m","5 m","10 m","20 m"],a:2,e:"Wavelength ≈ 300 / 14.2 ≈ 21 m; half is ≈ 10.5 m, a little shorter in practice (≈ 10 m)."},
{t:"A",q:"Roughly how long is a quarter-wave vertical for 145 MHz?",o:["50 cm","1 m","2 m","5 m"],a:0,e:"λ ≈ 2.07 m, so λ/4 ≈ 0.5 m."},
{t:"A",q:"Where is a half-wave dipole normally fed?",o:["At one end","In the centre","At a quarter of its length","Through the ground"],a:1,e:"A dipole is centre-fed, where its impedance is low (around 50–75 Ω), giving a good match to coax."},
{t:"A",q:"What does an SWR of 1:1 indicate?",o:["A perfect match between feeder and antenna","Maximum reflected power","A short circuit","An open circuit"],a:0,e:"1:1 means no reflected power. Higher SWR means more of the power is reflected back from a mismatch."},
{t:"A",q:"Where is an SWR meter connected?",o:["Between the transmitter and the antenna feeder","Between the PSU and the radio","On the microphone lead","Across the speaker"],a:0,e:"It is inserted in the feeder line, normally at the transmitter end, to measure forward and reflected power."},
{t:"A",q:"What does an ATU (antenna tuning unit) do?",o:["Increases transmitter power","Matches the antenna system impedance to the transmitter","Filters received noise","Changes polarisation"],a:1,e:"An ATU presents a good match (≈ 50 Ω) to the transmitter so it can deliver power safely. It doesn't make a poor antenna radiate better."},
{t:"A",q:"A balun is used to:",o:["Connect a balanced antenna to unbalanced coax","Measure SWR","Amplify signals","Store charge"],a:0,e:"BALanced-to-UNbalanced. A dipole is balanced; coax is unbalanced."},
{t:"A",q:"In a Yagi antenna, the reflector element is:",o:["Shorter than the driven element, in front","Longer than the driven element, behind it","The element the coax connects to","Only used on HF"],a:1,e:"Reflector: slightly longer, behind the driven element. Directors: shorter, in front. The beam points towards the directors."},
{t:"A",q:"Most FM mobile and repeater operation on VHF uses which polarisation?",o:["Horizontal","Vertical","Circular","None"],a:1,e:"FM/repeaters use vertical. Weak-signal SSB on VHF/UHF traditionally uses horizontal. Mismatched polarisation causes large losses."},
{t:"A",q:"What is meant by antenna gain?",o:["It makes the transmitter more powerful","It concentrates radiated power in some directions at the expense of others","It reduces SWR","It is the length of the antenna"],a:1,e:"Gain is focusing, not creating power. A beam radiates more in its main direction and less elsewhere."},
// Propagation
{t:"P",q:"How do HF signals normally travel long distances?",o:["Line of sight","Refraction by the ionosphere","Through the ground only","Via repeaters"],a:1,e:"HF \"sky wave\" is refracted by ionised layers in the upper atmosphere, returning to Earth hundreds or thousands of km away."},
{t:"P",q:"VHF and UHF signals normally have a range that is:",o:["Worldwide at all times","Mainly line of sight, a little beyond the horizon","Only a few metres","Only at night"],a:1,e:"VHF/UHF usually travel just beyond line of sight. Height of the antenna matters a lot. Occasional enhancements (lifts, Sporadic E) give more."},
{t:"P",q:"Which ionospheric layer absorbs lower HF signals during the day?",o:["D layer","E layer","F layer","Troposphere"],a:0,e:"The D layer forms in daylight and absorbs lower frequencies (e.g. 160/80 m), which is why those bands work best at night."},
{t:"P",q:"In general, which HF bands are best for long distance in daytime?",o:["Lower bands such as 80 m","Higher bands such as 20 m and up","Only 160 m","None"],a:1,e:"Higher HF bands (20 m, 15 m, 10 m) open in daylight when ionisation is strong. Lower bands are better after dark."},
{t:"P",q:"The \"skip zone\" is:",o:["Where signals are strongest","An area between ground-wave range and the first sky-wave return where signals are not heard","A part of the band plan","Interference from skipping CW"],a:1,e:"Stations too far for ground wave but too close for the sky wave to return to will not hear you."},
{t:"P",q:"What effect does the sunspot cycle have on HF?",o:["None","More sunspots generally improve propagation on higher HF bands","More sunspots close all HF bands","It only affects VHF"],a:1,e:"Around sunspot maximum, higher ionisation supports higher frequencies (e.g. 10 m and 6 m openings). The cycle is about 11 years."},
{t:"P",q:"Fading of a received HF signal (QSB) is often caused by:",o:["A faulty microphone","Changes in the ionosphere and multiple signal paths","Low SWR","Using SSB"],a:1,e:"Signals arriving by different paths add and cancel as the ionosphere changes, making them rise and fall."},
{t:"P",q:"Why does raising a VHF antenna usually improve range?",o:["It increases power","It extends the radio horizon and clears obstructions","It changes the frequency","It reduces the D layer"],a:1,e:"Higher antennas see further over the horizon and over buildings and terrain."},
// General radio knowledge (practice only, not in the mock exam)
{t:"G",q:"In 1901 Marconi's team sent the first transatlantic radio signal. Where did it start?",o:["Poldhu, Cornwall","Chelmsford, Essex","Dover, Kent","Holyhead, Anglesey"],a:0,e:"The signal, the Morse letter S, went from Poldhu in Cornwall to Signal Hill in Newfoundland."},
{t:"G",q:"Which scientist first demonstrated radio waves in a laboratory in the 1880s?",o:["Michael Faraday","Heinrich Hertz","Thomas Edison","Nikola Tesla"],a:1,e:"Heinrich Hertz proved electromagnetic waves exist, which is why the unit of frequency is named after him."},
{t:"G",q:"At roughly what speed do radio waves travel?",o:["343 metres per second","3,000 km per second","300,000 km per second","The speed varies with frequency"],a:2,e:"Radio waves are electromagnetic waves and travel at the speed of light, about 300,000 km/s. That figure is where the 300 in λ = 300/f comes from."},
{t:"G",q:"What does \"73\" mean at the end of a contact?",o:["Best regards","Please repeat","Going off air for food","Signal very weak"],a:0,e:"73 = best regards. You'll also see 88 (love and kisses) used between friends."},
{t:"G",q:"What does \"DX\" mean to a radio amateur?",o:["A digital mode","A long-distance contact or station","A dummy load","An exam pass"],a:1,e:"DX means distance. \"Working DX\" means contacting distant, often overseas, stations."},
{t:"G",q:"What does a station calling \"CQ DX\" want?",o:["Any station at all","Only distant stations, usually outside their own continent","Only local stations","A signal report from a repeater"],a:1,e:"CQ means a general call. Adding DX asks for long-distance replies only, so nearby stations should not answer."},
{t:"G",q:"What is a \"rag chew\"?",o:["A fault in coax","A long, relaxed chat rather than a quick exchange","A contest exchange","An antenna support"],a:1,e:"Rag chewing is unhurried conversation, the opposite of a contest-style \"59, thanks, 73\" contact."},
{t:"G",q:"What is the Morse code for SOS?",o:["··· --- ···","--- ··· ---","·-· ·-· ·-·","··· ··· ···"],a:0,e:"Three dots, three dashes, three dots, sent as one continuous signal."},
{t:"G",q:"Which letter is a single dot in Morse code?",o:["A","E","I","T"],a:1,e:"E is ·, the most common letter in English. T is a single dash."},
{t:"G",q:"The voice distress call \"Mayday\" comes from which language?",o:["French","Latin","German","Spanish"],a:0,e:"It comes from the French m'aider (help me)."},
{t:"G",q:"Which marine VHF channel is used for distress, safety and calling?",o:["Channel 6","Channel 13","Channel 16","Channel 70"],a:2,e:"Channel 16 (156.8 MHz) is for voice distress and calling. Channel 70 is reserved for DSC alerts, not voice."},
{t:"G",q:"Which international body coordinates radio spectrum use between countries?",o:["Ofcom","The RSGB","The ITU","The IARU"],a:2,e:"The International Telecommunication Union (a UN agency) sets the global frequency allocations. Ofcom regulates the UK. The IARU represents amateur societies such as the RSGB."},
{t:"G",q:"What does RSGB stand for?",o:["Radio Society of Great Britain","Royal Signals of Great Britain","Radio Standards Group (Britain)","Regional Spectrum Governance Board"],a:0,e:"The RSGB is the UK's national amateur radio society and runs the licence exams."},
{t:"G",q:"A callsign starting with DL is most likely from:",o:["Denmark","Germany","Poland","Ireland"],a:1,e:"DL = Germany. Other common prefixes include F (France), EI (Ireland), VK (Australia), JA (Japan) and W/K (USA)."},
{t:"G",q:"Which prefix block belongs to the UK?",o:["G and M (and 2 for Intermediate)","F","VE","ZL"],a:0,e:"UK callsigns start with G, M or 2. VE is Canada and ZL is New Zealand."},
{t:"G",q:"Why do amateurs log contacts in UTC rather than local time?",o:["It's a legal requirement in every country","So both stations record the same time wherever they are","UTC clocks are more accurate","Because UK time is ahead of UTC"],a:1,e:"UTC is a worldwide reference, so a contact between the UK and Japan is logged at the same time by both stations."},
{t:"G",q:"A Maidenhead locator such as IO91 describes:",o:["A repeater frequency","A grid square showing your approximate location","A licence class","A propagation forecast"],a:1,e:"Maidenhead locators divide the world into grid squares. Most of the UK falls in squares starting IO."},
{t:"G",q:"Summits on the Air (SOTA), which began in the UK, encourages operating from:",o:["Ships","Hill and mountain tops","Lighthouses","Railway stations"],a:1,e:"SOTA activators carry portable stations up qualifying summits. POTA (Parks on the Air) does the same in parks."},
{t:"G",q:"Jamboree on the Air (JOTA) is a yearly event mainly for:",o:["Contest professionals","Scouts and Guides","Military radio operators","Satellite operators"],a:1,e:"Scout and Guide groups get on air with help from licensed amateurs, often running stations under supervision."},
{t:"G",q:"What is RAYNET?",o:["A UK amateur group providing emergency communications support","A digital mode","A satellite network","An Ofcom department"],a:0,e:"RAYNET volunteers provide radio communications for emergency services and community events."},
{t:"G",q:"Amateurs can sometimes talk to astronauts on which spacecraft?",o:["The Hubble Space Telescope","The International Space Station","GPS satellites","The Moon lander"],a:1,e:"The ISS carries amateur radio equipment, and the ARISS programme arranges contacts with schools."},
{t:"G",q:"In Europe, APRS position reports on 2 m are usually sent on:",o:["144.800 MHz","145.500 MHz","146.520 MHz","433.500 MHz"],a:0,e:"144.800 MHz is the European APRS frequency. 146.520 MHz is the US FM calling frequency."},
{t:"G",q:"What is WSPR mainly used for?",o:["Long voice chats","Testing propagation with very low-power beacon signals","Sending pictures","Repeater linking"],a:1,e:"WSPR (\"whisper\") stations send tiny beacon signals, and receivers worldwide report hearing them online. It's a quick way to see how well your antenna gets out."},
{t:"G",q:"FM broadcast radio in the UK uses which band?",o:["88–108 MHz","530–1600 kHz","144–146 MHz","1.8–2.0 MHz"],a:0,e:"FM broadcast is 88–108 MHz (VHF Band II). Medium-wave AM broadcast is around 530–1600 kHz."},
{t:"G",q:"During an aurora, VHF signals reflected from it typically sound:",o:["Crystal clear","Rough and buzzy, with a distorted tone","Louder but normal","Completely silent"],a:1,e:"Auroral reflections add rapid distortion, so voice sounds harsh and CW has a rasping note. That's why CW and SSB are favoured for aurora contacts."},
// ===== Mock paper 2 (fixed set) =====
{p:2,t:"L",q:"Which UK licence class allows up to 100 W on most bands?",o:["Foundation","Intermediate","Full","None — 100 W needs special permission"],a:1,e:"Foundation 25 W, Intermediate 100 W, Full 1 kW (on primary bands)."},
{p:2,t:"L",q:"Who is responsible for transmissions made from your station?",o:["The manufacturer of the radio","The licensee","Ofcom","The RSGB"],a:1,e:"The licensee is responsible for the station and everything transmitted from it, including when supervising someone else."},
{p:2,t:"L",q:"Since 2024, Foundation licensees may use the 2.4 GHz and 5 GHz amateur bands at up to:",o:["0.5 W","2 W","25 W","100 W"],a:1,e:"These microwave bands were added for Foundation in 2024 with a 2 W limit."},
{p:2,t:"L",q:"A Foundation licensee with callsign M7ABC is operating in Northern Ireland. Which form may they use?",o:["MN7ABC","MI7ABC","GI7ABC","M7ABC/NI"],a:1,e:"I is the RSL for Northern Ireland, giving MI7ABC. RSLs are optional for Foundation since 2024."},
{p:2,t:"L",q:"May a Foundation licensee operate from a car?",o:["No, only from the main address","Yes, mobile operation is allowed","Only when parked","Only on 70 cm"],a:1,e:"Mobile and portable operation are both permitted, within the Foundation licence conditions."},
{p:2,t:"L",q:"With whom may you communicate under an amateur licence?",o:["Anyone with a radio","Other amateur stations","Only stations in the UK","Only stations of the same licence class"],a:1,e:"Amateur stations communicate with other amateur stations (plus permitted cases such as supervised messages)."},
{p:2,t:"O",q:"Another station asks you to \"QSY\". What should you do?",o:["Reduce power","Change frequency","Repeat your callsign","Stop transmitting permanently"],a:1,e:"QSY = change frequency, for example to move a long contact off a calling channel."},
{p:2,t:"O",q:"After making contact on the 2 m FM calling channel, you should:",o:["Stay on the calling channel","Move to another simplex frequency to continue","Move to a repeater output","Switch to SSB"],a:1,e:"Calling channels are for making contact. Moving off keeps them free for others."},
{p:2,t:"O",q:"Which modes are normally used for weak-signal 2 m contacts beyond local range?",o:["FM only","SSB and CW","AM","FM through a repeater"],a:1,e:"SSB and CW work much better on weak signals. The 2 m SSB centre of activity is 144.300 MHz."},
{p:2,t:"O",q:"What does the Q-code QSB mean?",o:["Fading signals","Interference from other stations","Change frequency","Confirm receipt"],a:0,e:"QSB = fading. QSL = confirm receipt."},
{p:2,t:"S",q:"Before working inside a mains-powered power supply you should:",o:["Switch it off at the front panel only","Unplug it and allow capacitors time to discharge","Wear rubber gloves and leave it on","Remove the fuse while it's running"],a:1,e:"Disconnect from the mains completely. Large capacitors can hold a dangerous charge after switch-off."},
{p:2,t:"S",q:"When raising a mast you should:",o:["Do it alone so nobody gets hurt","Have a helper and check there are no overhead power lines nearby","Do it in strong wind to test it","Attach the coax afterwards while climbing"],a:1,e:"Use a helper, keep the area clear and make sure the mast and antenna can't reach power lines if they fall."},
{p:2,t:"S",q:"Which fire extinguisher is suitable for an electrical fire in the shack?",o:["Water","Foam","CO₂","Wet chemical"],a:2,e:"CO₂ doesn't conduct electricity. Never use water on live electrical equipment."},
{p:2,t:"E",q:"RF breakthrough usually gets into a neighbour's TV through:",o:["The screen","Its aerial lead or mains lead","The remote control","The TV's speakers only"],a:1,e:"Long leads act as antennas and pick up your signal. Chokes on those leads are often the cure."},
{p:2,t:"E",q:"While investigating a neighbour's interference complaint, a quick temporary step is to:",o:["Increase power","Reduce your transmit power","Move to a broadcast band","Remove your antenna permanently"],a:1,e:"Lower power reduces the field strength at their equipment, which helps confirm the cause while you fix it properly."},
{p:2,t:"E",q:"Cheap switch-mode chargers and power supplies often cause:",o:["Broadband noise heard on your receiver","Better reception","Harmonics on your transmitter","Higher SWR"],a:0,e:"Poorly filtered switch-mode supplies radiate wideband noise that raises the noise floor, especially on HF."},
{p:2,t:"TE",q:"A 0.5 A current flows through a 24 Ω resistor. What is the voltage across it?",o:["2 V","12 V","24.5 V","48 V"],a:1,e:"V = I × R = 0.5 × 24 = 12 V."},
{p:2,t:"TE",q:"Two 100 Ω resistors are connected in parallel. Total resistance?",o:["50 Ω","100 Ω","200 Ω","10 Ω"],a:0,e:"Two equal resistors in parallel give half the value of one: 50 Ω."},
{p:2,t:"TE",q:"3.650 MHz is the same as:",o:["365 kHz","3,650 kHz","36,500 kHz","3,650 Hz"],a:1,e:"1 MHz = 1,000 kHz, so 3.650 MHz = 3,650 kHz."},
{p:2,t:"TR",q:"What does the RF power amplifier in a transmitter do?",o:["Generates the audio","Increases the signal level before it goes to the antenna","Filters out noise from the receiver","Sets the frequency"],a:1,e:"The PA raises the low-level RF signal to the output power that's fed to the antenna."},
{p:2,t:"TR",q:"What does SSB stand for?",o:["Single sideband","Signal strength booster","Standard signal band","Short skip band"],a:0,e:"Single sideband: the carrier and one sideband are removed, saving power and bandwidth."},
{p:2,t:"TR",q:"What does the RIT (or clarifier) control on a transceiver do?",o:["Changes transmit power","Shifts the receive frequency slightly without changing the transmit frequency","Turns on the squelch","Selects the antenna"],a:1,e:"RIT lets you tune in a station that's slightly off frequency, while you keep transmitting on the original frequency."},
{p:2,t:"A",q:"What is the effect of a long run of high-loss coax?",o:["More power reaches the antenna","Less power reaches the antenna and weak signals are reduced","The SWR at the antenna rises","No effect at HF or VHF"],a:1,e:"Feeder loss wastes power on transmit and weakens signals on receive. Loss grows with length and frequency."},
{p:2,t:"A",q:"Which antenna radiates equally in all horizontal directions?",o:["Yagi","Vertical","Dish","Long beam"],a:1,e:"A vertical is omnidirectional in the horizontal plane. A Yagi is directional."},
{p:2,t:"A",q:"Roughly how long is a half-wave dipole for 50 MHz?",o:["1.5 m","3 m","6 m","12 m"],a:1,e:"λ = 300 / 50 = 6 m, so half is 3 m (a little shorter in practice)."},
{p:2,t:"P",q:"Ground-wave propagation works best on:",o:["Lower frequencies such as MF and lower HF","UHF","Microwaves","Any frequency equally"],a:0,e:"Ground wave follows the Earth's surface and is absorbed less at lower frequencies."},
// ===== Mock paper 3 (fixed set) =====
{p:3,t:"L",q:"Since 2024, may Foundation licensees operate maritime mobile in international waters?",o:["No, never","Yes","Only within 12 miles of the coast","Only with a ship's radio licence officer present"],a:1,e:"Ofcom added maritime mobile operation in international waters for Foundation and Intermediate in 2024."},
{p:3,t:"L",q:"What does the suffix /P indicate?",o:["Private station","Portable operation","Power above 25 W","Phone (voice) only"],a:1,e:"/P = portable, /M = mobile, /MM = maritime mobile."},
{p:3,t:"L",q:"Which Regional Secondary Locator indicates the Isle of Man?",o:["M","I","D","J"],a:2,e:"D = Isle of Man. J = Jersey, U = Guernsey, I = Northern Ireland, M = Scotland."},
{p:3,t:"L",q:"Which of these is NOT permitted on the amateur bands?",o:["Discussing antenna experiments","Advertising your car for sale","Exchanging signal reports","Talking about the weather"],a:1,e:"Amateur radio can't be used for business or advertising."},
{p:3,t:"L",q:"How much does a Foundation licence cost if you apply online?",o:["It's free","£20 per year","£75 one-off","It depends on the bands you use"],a:0,e:"Applying online through Ofcom is free. You only pay the exam fee to the RSGB."},
{p:3,t:"L",q:"Unlicensed people may only send messages through your station when:",o:["You are out of the room","You directly supervise them and identify with your callsign","They use their own made-up callsign","It's an emergency drill"],a:1,e:"The licensee must be present, supervising, and identifying the station."},
{p:3,t:"O",q:"What does the Q-code QRM mean?",o:["Natural noise","Man-made interference","Fading","Reduce power"],a:1,e:"QRM = man-made interference, such as other stations. QRN = natural noise, such as static from lightning."},
{p:3,t:"O",q:"G4XYZ calls CQ. You (M7ABC) reply with:",o:["\"CQ CQ, this is M7ABC\"","\"G4XYZ, this is M7ABC\"","\"M7ABC, this is G4XYZ\"","Just \"M7ABC\" repeatedly"],a:1,e:"Give their callsign first, then yours. That's the standard way to answer a call."},
{p:3,t:"O",q:"In CW, the letter K at the end of an over means:",o:["Closing down","Go ahead, invitation to transmit","Error, repeat","Wait"],a:1,e:"K = over, invitation to transmit. Sending SK means end of contact."},
{p:3,t:"O",q:"A report of \"3 and 5\" (R3 S5) means:",o:["Perfect copy, very strong","Readable with considerable difficulty, fairly good strength","Unreadable","Distorted audio"],a:1,e:"R3 = readable with considerable difficulty. S5 = fairly good signals."},
{p:3,t:"S",q:"If thunderstorms are expected near your station, it's good practice to:",o:["Keep transmitting to stay on top of the static","Disconnect the antenna feeder from the radio","Unplug only the microphone","Turn up the squelch"],a:1,e:"Disconnecting (and ideally earthing) the feeder outside the shack reduces lightning damage and risk."},
{p:3,t:"S",q:"A fuse has blown. Before replacing it you should:",o:["Fit a bigger fuse so it won't blow again","Find the cause and fit the correct rating","Wrap the old fuse in foil","Bypass it temporarily"],a:1,e:"A fuse blows for a reason. Find the fault, then replace the fuse like for like."},
{p:3,t:"S",q:"When soldering you should:",o:["Rest the iron on the bench","Use a stand and good ventilation","Hold the joint in your fingers","Use lead-free solder only outdoors"],a:1,e:"A hot iron needs a proper stand. Flux fumes are irritating, so ventilate the area."},
{p:3,t:"E",q:"Which is most likely to reduce EMC problems?",o:["A well-matched antenna sited away from the house","An indoor antenna near the TV","Running maximum power","Using thin, long power leads"],a:0,e:"A good match and distance from household wiring and electronics keep stray RF to a minimum."},
{p:3,t:"E",q:"Why keep a record of when and where you transmitted?",o:["It's required to renew your licence","It helps match times to any interference complaint","It improves your SWR","It's needed for the exam"],a:1,e:"A log of times and frequencies makes it easy to check whether you were on air when a problem occurred."},
{p:3,t:"E",q:"What is the second harmonic of 144.5 MHz?",o:["72.25 MHz","145 MHz","289 MHz","433.5 MHz"],a:2,e:"2 × 144.5 = 289 MHz."},
{p:3,t:"TE",q:"A transceiver delivers about 25 W from a 12 V supply. Ignoring losses, roughly what current is drawn?",o:["0.5 A","2 A","12 A","300 A"],a:1,e:"I = P / V = 25 / 12 ≈ 2 A. Real radios draw more, because they aren't 100% efficient."},
{p:3,t:"TE",q:"Resistance is measured in:",o:["Volts","Amps","Ohms","Watts"],a:2,e:"Ohms (Ω). Voltage is in volts, current in amps, power in watts."},
{p:3,t:"TE",q:"A battery supplies:",o:["Alternating current (AC)","Direct current (DC)","Radio frequency","Pulsed AC"],a:1,e:"Batteries give DC. The mains is AC at 50 Hz."},
{p:3,t:"TR",q:"On FM, shouting into the microphone or holding it too close can cause:",o:["Over-deviation and a wider signal","Lower SWR","Better audio","Higher receive sensitivity"],a:0,e:"Too much audio over-deviates the FM signal, causing distortion and interference to adjacent channels."},
{p:3,t:"TR",q:"A transceiver is:",o:["A receiver only","A transmitter and receiver combined in one unit","An antenna tuner","A power supply"],a:1,e:"Most modern amateur radios, including the Xiegu G90, are transceivers."},
{p:3,t:"TR",q:"What does the S-meter on a receiver show?",o:["SWR","Received signal strength","Transmit frequency","Battery voltage"],a:1,e:"The S-meter indicates signal strength, usually from S1 to S9 and then dB over S9."},
{p:3,t:"A",q:"Where is the voltage highest on a half-wave dipole?",o:["At the centre","At the ends","Evenly along its length","At the coax connector"],a:1,e:"Current is highest at the centre and voltage is highest at the ends. That's why the wire ends need good insulators."},
{p:3,t:"A",q:"If you shorten a dipole, its resonant frequency will:",o:["Go up","Go down","Stay the same","Double"],a:0,e:"Shorter antenna, higher frequency. Trim to move the resonance up, add wire to move it down."},
{p:3,t:"A",q:"Which RF connector is preferred at UHF for lower loss and better weatherproofing?",o:["PL259 / SO239","N-type","Phono (RCA)","Crocodile clip"],a:1,e:"N-type connectors are constant-impedance and seal well. PL259 is fine on HF but lossier at UHF."},
{p:3,t:"P",q:"Sporadic E typically gives:",o:["Steady openings all winter on 80 m","Short, strong openings mainly in summer on bands such as 10 m and 6 m","Only local VHF contacts","Ground-wave contacts on 160 m"],a:1,e:"Patches of intense ionisation in the E layer cause sudden openings over 500–2000 km, mostly from May to August."}
];
// ===== Official RSGB Foundation mock papers 1–3 (syllabus v1.6b, April 2026) — order and options kept as published =====
const R=[
// Mock 1 (paper 4)
[4,"L","Which, of the items listed below, is NOT a type of Amateur licence?",["Full.","Foundation.","Intermediate.","Beginner."],3,"The three UK licence levels are Foundation, Intermediate and Full. There is no Beginner licence."],
[4,"L","You are operating in the 'all modes' section of the 2 metre band plan, sending CW with the 'mode' (type of transmission) switch set to CW. You then switch mode to FM to talk to your Morse practice tutor. Before discussing your Morse sending you should",["start your transmission by saying 'CQ'.","disconnect the Morse key.","give your callsign in voice.","say that you have changed mode."],2,"Changing mode counts as starting a new transmission, so you identify again in the new mode, here by voice."],
[4,"L","An amateur is not operating in accordance with the licence if they",["fail to give the call sign of the person being spoken to on every over.","transmit information intended for general reception.","transmit to a group of more than five amateurs.","transmit to amateurs outside Europe."],1,"Material intended for general reception is broadcasting, which isn't allowed. Nets of any size and worldwide contacts are fine."],
[4,"L","An authorised person from which organisation has the right to require modification of the Radio Equipment?",["The Radio Society of Great Britain.","The Institute of Engineering and Technology.","The local electricity supply company.","Ofcom."],3,"Only a person authorised by Ofcom can require you to modify, restrict or close down your station."],
[4,"L","For the purposes of the EMF requirements in the amateur licence the description \"General Public\" means",["everybody apart from the licence holder in person.","everybody except those living at the amateur's house.","people outside the amateur's circle of family and friends.","people outside the amateur's family and relatives."],0,"Everyone except you counts as the general public, including your own household."],
[4,"L","When in London, the band 431.0-432.0MHz is",["not available.","secondary.","limited to 10W.","limited to 10W erp."],0,"Schedule 1 (EX307): 431–432 MHz isn't available within 100 km of Charing Cross, London."],
[4,"TE","The Volt is a unit of",["current flow.","potential difference.","power.","resistance."],1,"Volts measure potential difference (voltage). Current is in amps, power in watts and resistance in ohms."],
[4,"TE","Alternating current is",["a current greater than 240 A.","a current greater than 0.6A.","obtainable from batteries.","a current which periodically changes in direction."],3,"AC reverses direction periodically (50 times a second for UK mains). Batteries give DC."],
[4,"TE","The key feature of a digital signal, when compared to an analogue signal is that",["the change between the amplitude of the signal at one instant in time to another is smooth and gradual.","the maximum amplitude of the signal is not limited as a result of digital processing.","a digital signal can represent an analogue signal that has been sampled at regular intervals.","It is not possible to process a digital signal using software applications and techniques."],2,"A digital signal is a series of values taken by sampling the analogue signal at regular intervals. A smooth change describes an analogue signal."],
[4,"TR","The process of making a radio wave carry the information we want to send is known as",["communication.","broadcast.","transmission.","modulation."],3,"Modulation puts the information (voice, data) onto the radio-frequency carrier."],
[4,"TR","What is the function of the box marked '2' on the transmitter block diagram?",["Oscillator.","RF amplifier.","Audio amplifier.","Modulator."],3,"Working from the microphone: 1 audio amplifier, 2 modulator, 3 oscillator (feeding the modulator), 4 RF amplifier to the antenna.","tx"],
[4,"TR","The function of a radio receiver is to recover information sent from one place to another using",["sympathetic radiation.","parasitic radiation.","harmonic radiation.","electromagnetic radiation."],3,"Radio waves are electromagnetic radiation."],
[4,"A","A coaxial cable is most widely used to connect a transmitter to an antenna because",["it is light weight.","it is a balanced feeder.","it is flexible.","of its screening qualities."],3,"The outer braid screens the signal, so coax can run near other objects without radiating or picking up much. Coax is an unbalanced feeder."],
[4,"A","The polarisation of the radio wave from an antenna depends on the",["mode switch on the transmitter.","orientation of the antenna.","transmitted frequency.","ionosphere."],1,"Horizontal elements give horizontal polarisation and vertical elements give vertical polarisation."],
[4,"A","A radio amateur decides to erect a second dipole of the same type but a different length. This is done because",["the second antenna will be kept as a spare.","the second antenna is intended to be used on a different frequency.","the amateur wants to talk to two friends at the same time.","two antennas will give a stronger signal than one."],1,"A dipole's length sets its resonant frequency, so a different length means a different band."],
[4,"P","A mobile VHF radio receiver is fitted in a car. The car is driven along a clear open road directly away from the transmitter but is always in sight of the transmitter. The received signal will",["remain a constant strength or level all the time the transmitter is in sight.","vanish once the transmit aerial is too small to be seen.","get stronger as the distance increases.","get weaker as the distance increases."],3,"Signal strength falls as distance increases, even with a clear line of sight."],
[4,"P","Ducting is a propagation effect that",["extends the range of HF signals.","reduces the range of VHF and UHF signals.","extends the range of VHF and UHF signals.","reduces the range of HF signals."],2,"Temperature inversions in the troposphere can trap VHF/UHF signals in a duct and carry them hundreds of km (a \"lift\")."],
[4,"E","The avoidance of interference between two items of electrical equipment is known as",["SWR.","VHF.","EMF.","EMC."],3,"EMC = electromagnetic compatibility. EMF = electromagnetic fields (the exposure rules)."],
[4,"E","Which of the following modes of transmission is MOST likely to cause interference to nearby radio or television receivers?",["SSB.","FM voice.","FM data.","PSK31 (a data mode)."],0,"SSB's amplitude varies with speech, and audio circuits in nearby equipment easily demodulate it. Constant-amplitude FM is much less of a problem."],
[4,"E","A case of interference is proving difficult to solve. Before calling Ofcom, who else may be able to help you?",["British Telecom.","The local broadcast radio station.","The local authority.","The RSGB EMC committee."],3,"The RSGB EMC committee gives advice and publishes guidance on interference cases."],
[4,"O","Before making an initial call a radio amateur should",["listen on the frequency.","make an entry in the log book.","log the frequency.","check the transmitter power."],0,"Always listen first, so you don't transmit over a contact already in progress."],
[4,"O","Band Plans are published because",["it allows the different modes and types of transmission to best share the band.","it is a convenient way of remembering the schedule to the amateur licence.","it is illegal to operate in contravention of the band plan.","it allocates most of the band to the higher power stations."],0,"Band plans are voluntary agreements so different modes can share a band. They aren't law, but everyone is expected to follow them."],
[4,"O","Connecting anything to the Microphone socket of a transmitter other than the supplied microphone may",["cause incorrect operation of the PTT.","cause a decrease in SWR.","cause an increase SWR.","cause changes in the received signal."],0,"Mic sockets often carry the PTT line and DC. The wrong connection can key the transmitter or stop it keying."],
[4,"S","High voltages may cause",["poor audio reception.","overheating.","poor signal strength.","electrocution."],3,"The safety risk from high voltage is electric shock, which can kill."],
[4,"S","A risk when drilling metal is",["the centre punch will mark the work.","swarf will fly up towards the eyes.","the drill bit will become blunt.","an electric shock may occur."],1,"Metal swarf can fly off, so wear eye protection."],
[4,"S","The main detrimental effect on health of being too close to a high power transmission is",["repetitive strain injury.","heating of body tissue.","loss of memory.","premature deafness."],1,"RF energy heats body tissue. That's what the EMF exposure limits protect against."],

[5,"L","If you move house and want to transmit from your new home, you must",["give immediate notice of the new address to Ofcom.","pay a supplementary licence fee.","notify the local police by letter.","inform RSGB headquarters by e-mail or phone."],0,"Your main station address is part of your licence, so tell Ofcom straight away. There's no fee."],
[5,"L","The Licensees callsign must be transmitted",["when first establishing contact.","when another Station replies to a \"CQ\" call.","every hour.","when the entry is made in the log book."],0,"Identify when you first make contact, at the start and end of transmissions, and at least every 15 minutes."],
[5,"L","Before joining your regular club net from your main station address, you must first",["ask if the frequency is clear.","give your location using either your address or other geographical description correct to 5 km.","give your location using either your full postcode or the IARU locator to 6 characters.","establish communication with at least one amateur in the net."],3,"RSGB's key gives D. You only have to give your location when operating away from your main address, and asking whether the frequency is in use is good practice rather than a licence condition."],
[5,"L","Foundation licence holder may be instructed to keep a log of transmissions for a period by",["an employee of British Telecom.","a person authorised by Ofcom.","the Police.","the Local Council."],1,"Logging isn't compulsory unless a person authorised by Ofcom tells you to keep one."],
[5,"L","The lowest radiated power to which the EMF requirements apply is",["10W peak.","10W EIRP.","10W ERP.","10W."],1,"The EMF assessment requirement applies to stations radiating more than 10 W EIRP."],
[5,"L","When close to London, operating on a frequency of 431.5MHz is",["limited to a transmit power of 10W erp.","not permitted.","only allowed from fixed stations, no mobile operation.","permitted using Morse and telephony only."],1,"431–432 MHz isn't available within 100 km of Charing Cross (Schedule 1, EX307)."],
[5,"TE","If two resistors of different values are connected in parallel and a potential difference is applied across them, the potential difference will be",["highest across the resistor with the highest value.","the same across both resistors.","equal to the total resistance divided by the potential difference applied.","the sum of the potential difference across each resistor."],1,"Parallel components are connected across the same two points, so they share the same voltage. Their currents differ."],
[5,"TE","Which one of the following bands is known as VHF spectrum?",["30Hz to 300MHz.","300MHz to 3000MHz.","300kHz to 3MHz.","30MHz to 300MHz."],3,"HF 3–30 MHz, VHF 30–300 MHz, UHF 300–3000 MHz."],
[5,"TE","An Analogue to Digital convertor (ADC)",["Changes AF signals to RF.","Is an optional component in a Software Defined Radio Receiver.","Samples an analogue signal and creates a digital representation of it.","Creates a digital signal in analogue format."],2,"An ADC samples the analogue signal and converts each sample to a number. A DAC does the reverse. An SDR depends on an ADC, so it isn't optional."],
[5,"TR","A transmission is heard using a few audio tones sent in succession. It is likely to be",["a repeater tone burst.","data.","an encrypted signal.","music."],1,"Data modes such as RTTY and FSK send information as shifts between audio tones."],
[5,"TR","The oscillator stage of a transmitter",["will cause interference unless built in a plastic enclosure or box.","is only needed if the user wishes to send Morse code.","defines the transmitted frequency.","determines the tone of the audio signal."],2,"The oscillator generates the RF and sets the transmitted frequency."],
[5,"TR","In the block diagram of a radio receiver shown, what is the function of the box marked '2'?",["Modulation.","Tuning and RF amplifier.","Detection.","Audio amplifier."],2,"From the antenna: 1 tuning and RF amplifier, 2 detector (demodulator), 3 audio amplifier, 4 loudspeaker.","rx"],
[5,"A","The proportion of the radio signal lost in a feeder will",["decrease as the frequency increases.","increase as the frequency increases.","stay much the same at any frequency.","depend on the type of modulation."],1,"Feeder loss rises with frequency, which is why low-loss coax matters most at VHF/UHF."],
[5,"A","The polarisation of the radio wave from the antenna shown is",["horizontal.","unknown.","sideways.","vertical."],0,"The Yagi's elements are horizontal, so the radiated wave is horizontally polarised.","yagi"],
[5,"A","Which one of the following should be used to indicate the reflected power in a feeder to an antenna?",["An absorption wave-metre.","A digital multi-meter.","An oscilloscope.","An SWR meter."],3,"An SWR meter shows forward and reflected power in the feeder."],
[5,"P","The troposphere",["is the region above the ionosphere.","absorbs radio waves at night.","is the region below the ionosphere.","is ionised only during the day."],2,"The troposphere is the lowest layer of the atmosphere, where weather happens, below the ionosphere."],
[5,"P","Attenuation of UHF signals can be caused by",["carbon dioxide.","fog.","falling snow.","ozone."],2,"Precipitation such as rain and falling snow absorbs and scatters UHF and microwave signals."],
[5,"E","The ability of a piece of equipment to withstand a level of interference is known as",["immunity.","filtering.","compatibility.","resistance."],0,"Immunity is how well equipment rejects unwanted signals."],
[5,"E","An amateur transmitter is designed to radiate from the antenna. How might signals enter other electrical devices in the house?",["By being picked up by mains wires leading to the affected device.","By direct radiation out of the front panel of the transmitter.","By being conducted along the microphone lead.","By radiating from the Morse key."],0,"Mains and other long leads act as antennas and carry RF into the affected equipment."],
[5,"E","If a neighbour complains of interference from your station you should first",["keep a log of your transmissions and ask your neighbour to log instances of interference.","ask the neighbour to demonstrate the problem.","check that you have been operating in accordance with the licence Schedule.","check that your licence has not expired."],0,"Comparing the two logs shows whether the interference matches your transmissions."],
[5,"O","When calling CQ on a VHF FM calling channel, a radio amateur should",["give the call sign 2 or 3 times and say \"CQ\" when somebody replies.","say \"CQ\" 2 or 3 times and give the call sign, then listen for a reply.","say \"CQ\" a number of times and give the call sign when a contact is established.","say \"CQ\" about 20 times and listen for a reply."],1,"Keep calls short on VHF FM. Say CQ a couple of times, give your callsign, then listen."],
[5,"O","Radio astronomy has the use of the frequency band",["87.5-108.0MHz.","150.05-152.0MHz.","156.0-158.525MHz.","144.0-146.0MHz."],1,"From the frequency allocation table in EX307: 150.05–152.0 MHz is radio astronomy. 87.5–108 is broadcasting and 156–158.525 is maritime."],
[5,"O","A good received SSB voice signal may be reported as",["five and eight.","one one one.","nine nine nine.","eight and five."],0,"RS report: readability (1–5) first, then strength (1–9). 5 and 8 is perfectly readable and strong. Readability can't be 8 or 9."],
[5,"S","The correct connections for a 3 core cable to a UK mains plug are",["blue to N, brown to L, green/yellow to E.","brown to L, blue to E, green/yellow to N.","brown to N, blue to L, green/yellow to E.","blue to L, brown to E, yellow/green to N."],0,"Brown = live, blue = neutral, green/yellow = earth."],
[5,"S","When not being used, a hot soldering iron should be",["placed in cold water.","wiped clean of old solder.","put in a well ventilated room.","placed in a suitable stand."],3,"Always park a hot iron in a proper stand."],
[5,"S","The ICNIRP is the body which advises on",["protective multiple earthing.","amateur band planning.","safe levels of RF exposure.","curing EMC problems."],2,"The International Commission on Non-Ionizing Radiation Protection sets the RF exposure guidelines the EMF rules are based on."],
// Mock 3 (paper 6)
[6,"L","Which item below is a type of UK amateur licence?",["Intermediate.","Senior.","Technician.","Beginner."],0,"Foundation, Intermediate and Full are the UK licences."],
[6,"L","The Station callsign must be transmitted",["when the entry is made in the log book.","at the end of each transmission.","every half hour and when the Station is closing down.","at the beginning of a transmission on a new frequency."],3,"Moving to a new frequency starts a new transmission, so you identify at the start of it."],
[6,"L","Which of the following messages is NOT permitted by the Foundation licence?",["A reply to a \"CQ\" call.","Agreeing to meet at the radio club.","A secret message to a radio amateur friend.","A message in Morse code."],2,"Messages mustn't be encrypted or hidden. Morse is a public code, so it's allowed."],
[6,"L","When MUST a Foundation licensee keep a log of transmissions?",["When in another Region of the UK.","When a contest is being held in the same frequency band as you are operating.","When operating from a Temporary Location.","When instructed to do so by an Ofcom official."],3,"A log is only compulsory when a person authorised by Ofcom requires one."],
[6,"L","An amateur determines that the station is compliant with the EMF requirements set out in the amateur licence. What must then be done?",["Enter the date of the compliance check in the station log.","Keep a record showing how the station is compliant.","Send a copy of the relevant calculations to Ofcom.","Send a copy of the relevant calculations to the RSGB."],1,"Keep your assessment records so you can show Ofcom on request. You don't send them in."],
[6,"L","The highest frequency allocated to Foundation Licensees is",["440.0MHz.","10500MHz.","52.0MHz.","146.0MHz."],1,"Schedule 1 now includes 10 GHz bands up to 10.500 GHz (1 W). Check the EX307 table."],
[6,"TE","In a resistor there is a transfer of energy from",["chemical energy to electrical energy.","electrical energy to chemical energy.","thermal energy (heat) to electrical energy.","electrical energy to thermal energy (heat)."],3,"Resistors turn electrical energy into heat."],
[6,"TE","In which amateur band are frequencies between 28.225 and 28.300MHz?",["10 metres.","30 metres.","15 metres.","40 metres."],0,"300 / 28.25 ≈ 10.6 m, so this is the 10 m band (28.0–29.7 MHz)."],
[6,"TE","Analogue signals",["Are a stream of finite values at a specific sampling interval.","Are constantly changing in amplitude, frequency or both.","Are produced by an analogue to digital converter.","Must be processed by a computing device with suitable software."],1,"Analogue signals vary continuously. Sampled, finite values describe a digital signal."],
[6,"TR","Amplitude modulation (AM) produces",["a radio frequency signal which is changing in frequency.","a single sideband with no carrier.","two sidebands and a full carrier.","a single sideband with a full carrier."],2,"AM = carrier plus upper and lower sidebands. SSB removes the carrier and one sideband."],
[6,"TR","The microphone amplifier in an analogue amateur radio transmitter limits the audio frequencies to the range",["20Hz to 15kHz.","300Hz to 3000Hz.","300Hz to 15kHz.","50Hz to 300Hz."],1,"About 300–3000 Hz is enough for clear speech and keeps the signal narrow."],
[6,"TR","In which block of the radio receiver shown is the audio modulation recovered?",["Block 4.","Block 1.","Block 3.","Block 2."],3,"Block 2 is the detector, which recovers the audio from the RF signal. Block 4 is the loudspeaker.","rx"],
[6,"A","A balun is",["used instead of a dummy load.","a particular type of antenna.","used to connect a dipole to coaxial cable.","a type of feeder."],2,"A balun joins a balanced antenna (dipole) to unbalanced feeder (coax)."],
[6,"A","A particular yagi antenna has a gain of 3 times. Which transmitter will result in an ERP of 60W?",["20W.","60W.","15W.","30W."],0,"ERP = power × gain, so power = 60 ÷ 3 = 20 W."],
[6,"A","A radio amateur has a single wire antenna for use on all the HF bands. What should be used to ensure the antenna can accept RF power from the transmitter on any of the bands?",["A ferrite ring filter.","An antenna matching unit.","A voltmeter.","A power supply."],1,"An antenna matching unit (ATU) matches the wire to 50 Ω on each band, much like the G90's built-in tuner."],
[6,"P","The ionosphere is",["a type of spherical transmitting antenna.","another name for the air we breathe.","a piece of amateur radio test equipment.","conductive gasses at heights of 70 to 400km."],3,"The ionosphere is ionised, conductive gas roughly 70–400 km up that refracts HF signals."],
[6,"P","Where should a radio amateur place the antenna to achieve the best range?",["On the roof.","On a tripod in the garden.","On the side of the house away from the distant Station.","In the lounge."],0,"Height and clear surroundings give the best range."],
[6,"E","The audio from a medium wave broadcast receiver sounds distorted when an amateur transmitter is in use. A likely reason for this is",["the signal from the amateur transmitter is causing interference.","that the electricity supply cannot power transmitters and receivers at the same time.","the transmitter is operating on the wrong sideband.","the broadcast receiver is not tuned in to the amateur transmitter."],0,"Distortion that coincides with your transmissions points to breakthrough from your signal."],
[6,"E","What is the purpose of a ferrite ring on the mains lead of an equipment found likely to suffer from interference?",["The ferrite ring will ensure the interference on each of the mains wires is equal.","The ferrite ring will avoid the need for the equipment to be earthed.","The ferrite ring will minimise unwanted signals leaking out of the affected equipment.","The ferrite ring will minimise any RF on the mains lead from entering the equipment."],3,"The ferrite chokes RF travelling along the lead so it doesn't reach the affected equipment."],
[6,"E","Which organisation produces guidance on dealing with cases of interference?",["The Radio Society of Great Britain.","The local authority planning department.","The Police.","A User Service."],0,"The RSGB (through its EMC committee) publishes interference guidance."],
[6,"O","The reason for having a calling channel is to",["follow the licence conditions.","maximise interference to other callers.","contact other club members.","provide a known frequency where contacts may be established."],3,"Everyone knows where to call, and once in contact you move off the calling channel."],
[6,"O","During a conversation via a UHF amateur repeater it is noted that after a couple of minutes a beeping tone is heard on the audio of the repeater. It is likely that this tone",["indicates a malfunction in the repeater.","is a time-out tone added to overly long 'overs'.","is due to a beat note between the input and output audio signals.","indicates the need for CTCSS access to the repeater."],1,"Repeaters time out long overs to stop one station hogging them. The beeps warn you to stop."],
[6,"O","Which of the following frequencies should be avoided for terrestrial contacts?",["145.900MHz.","144.050MHz.","145.500MHz.","144.300MHz."],0,"145.806–146.000 MHz is the satellite-exclusive segment in the 2 m band plan (EX307)."],
[6,"S","An important difference between a fuse and an RCBO (Residual current Circuit Breaker with Overload protection) is that",["a fuse protects against excessive currents but an RCBO will also detect small currents to earth.","a fuse will blow if the live wire is touched but an RCBO is unlikely to respond to that event.","an RCBO does not provide all the protection of a properly fitted and rated fuse.","an RCBO must not be used if there is a fuse in the plug of any appliances that will be used."],0,"An RCBO trips on overload and also on small earth leakage currents, such as current flowing through a person."],
[6,"S","When climbing a ladder to erect an antenna",["maintain a good electrical connection with earth using a length of wire.","choose a very dry day to reduce the effects of static charge.","always use the help of an assistant to hold the ladder.","always use a wooden ladder to avoid electric shock."],2,"Have someone foot and steady the ladder."],
[6,"S","It is dangerous to touch a transmitting antenna because",["a shock or burn may occur.","damage may be caused to the transmitter.","the SWR will be changed.","the signal will not be transmitted properly."],0,"High RF voltages on the antenna can cause shocks and RF burns."]

{t:"L",q:"An Intermediate licensee with callsign 2E0ABC operates from their main station in Wales. Which form may they use?",o:["2W0ABC","GW0ABC","2E0ABC/W","MW0ABC"],a:0,e:"For Intermediate callsigns the RSL replaces the E: 2W Wales, 2M Scotland, 2I Northern Ireland, 2D Isle of Man, 2J Jersey, 2U Guernsey."},

{t:"L",q:"Using EX308, 10.475–10.500 GHz is:",o:["Primary for the Amateur Service","Secondary for the Amateur Service","Not allocated to the Amateur Service, only Amateur Satellite (secondary)","Available only with Ofcom's written consent"],a:2,e:"Read the table carefully: this slice is Amateur Satellite only. Questions like this test whether you can use the booklet."},

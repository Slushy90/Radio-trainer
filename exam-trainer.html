// Technical aspects
{t:"TE",q:"A 12 V supply drives 30 mA through a resistor. What is its resistance?",o:["36 Ω","400 Ω","2.5 kΩ","360 Ω"],a:1,e:"R = V ÷ I = 12 ÷ 0.03 = 400 Ω."},
{t:"TE",q:"A 50 Ω dummy load has 20 V rms across it. What power is it dissipating?",o:["0.4 W","8 W","20 W","1000 W"],a:1,e:"P = V² ÷ R = 400 ÷ 50 = 8 W."},
{t:"TE",q:"Resistors of 220 Ω, 330 Ω and 470 Ω are connected in series. Total resistance?",o:["1.02 kΩ","98 Ω","470 Ω","340 Ω"],a:0,e:"Series resistors add: 220 + 330 + 470 = 1020 Ω."},
{t:"TE",q:"A 10 nF and a 15 nF capacitor are connected in series. Total capacitance?",o:["25 nF","6 nF","12.5 nF","150 nF"],a:1,e:"Series capacitors combine like parallel resistors: (10 × 15) ÷ (10 + 15) = 6 nF."},
{t:"TE",q:"100 pF and 220 pF capacitors are connected in parallel. Total capacitance?",o:["69 pF","160 pF","320 pF","22,000 pF"],a:2,e:"Parallel capacitors add: 100 + 220 = 320 pF."},
{t:"TE",q:"Two 10 µH inductors are connected in parallel with no mutual coupling. Total inductance?",o:["5 µH","10 µH","20 µH","100 µH"],a:0,e:"Parallel inductors combine like parallel resistors. Two equal ones give half: 5 µH."},
{t:"TE",q:"A sine wave has a peak value of 17 V. Its rms value is about:",o:["8.5 V","12 V","17 V","24 V"],a:1,e:"Vrms = Vpeak ÷ √2 = 17 ÷ 1.414 ≈ 12 V."},
{t:"TE",q:"A signal has a period of 0.5 ms. Its frequency is:",o:["500 Hz","2 kHz","5 kHz","20 kHz"],a:1,e:"f = 1 ÷ t = 1 ÷ 0.0005 = 2000 Hz."},
{t:"TE",q:"What is the wavelength of a 7.1 MHz signal?",o:["4.2 m","21 m","42 m","71 m"],a:2,e:"λ = 300 ÷ f (MHz) = 300 ÷ 7.1 ≈ 42 m, which is the 40 m band."},
{t:"TE",q:"As frequency increases, the reactance of an inductor:",o:["increases","decreases","stays the same","falls to zero"],a:0,e:"XL = 2πfL, so it rises in proportion to frequency."},
{t:"TE",q:"As frequency increases, the reactance of a capacitor:",o:["increases","decreases","stays the same","becomes infinite"],a:1,e:"XC = 1 ÷ (2πfC), so it falls as frequency rises."},
{t:"TE",q:"A transformer has 1150 primary turns and 60 secondary turns, fed from 230 V. Secondary voltage?",o:["12 V","19 V","4.4 V","60 V"],a:0,e:"Vs = Vp × Ns ÷ Np = 230 × 60 ÷ 1150 = 12 V."},
{t:"TE",q:"A tuned circuit resonates at 7 MHz with a bandwidth of 14 kHz. Its Q is:",o:["50","98","500","0.002"],a:2,e:"Q = centre frequency ÷ bandwidth = 7,000 kHz ÷ 14 kHz = 500."},
{t:"TE",q:"A transistor with β = 100 has a base current of 50 µA. Collector current?",o:["0.5 mA","5 mA","50 mA","2 mA"],a:1,e:"Ic = β × Ib = 100 × 50 µA = 5000 µA = 5 mA."},
{t:"TE",q:"A silicon diode conducts when:",o:["its anode is positive with respect to its cathode","its cathode is positive with respect to its anode","any voltage is applied","it is reverse biased"],a:0,e:"Forward bias (anode +) lets it conduct once about 0.6 V is exceeded. Reverse bias blocks current."},
{t:"TE",q:"Speech audio up to 3 kHz is to be digitised. The minimum sampling rate is:",o:["1.5 kHz","3 kHz","6 kHz","300 Hz"],a:2,e:"The Nyquist rate is twice the highest frequency: 2 × 3 kHz = 6 kHz. Below that you get aliasing."},
{t:"TE",q:"A battery reads 12.6 V off load and 12.0 V when supplying 3 A. Its internal resistance is:",o:["0.2 Ω","0.6 Ω","4 Ω","2 Ω"],a:0,e:"The 0.6 V drop at 3 A gives r = 0.6 ÷ 3 = 0.2 Ω."},
{t:"TE",q:"9 V is applied across a 1 kΩ and a 2 kΩ resistor in series. Voltage across the 2 kΩ?",o:["3 V","4.5 V","6 V","9 V"],a:2,e:"Potential divider: 9 × 2 ÷ (1 + 2) = 6 V."},
{t:"TE",q:"A full-wave rectifier runs from 50 Hz mains. The ripple frequency is:",o:["25 Hz","50 Hz","100 Hz","200 Hz"],a:2,e:"Both half-cycles are used, giving 100 pulses per second. A half-wave rectifier gives 50 Hz ripple."},
{t:"TE",q:"Why is a switch-mode power supply lighter than a linear supply of the same rating?",o:["It has no smoothing at all","Its transformer works at a high frequency, so it can be much smaller","It uses no semiconductors","It runs directly from 12 V"],a:1,e:"At tens of kHz, a small ferrite transformer does the job of a heavy 50 Hz iron one."},
{t:"TE",q:"A Zener diode is typically used to:",o:["provide a stable reference voltage","rectify RF","store charge","tune an oscillator"],a:0,e:"Reverse-biased at its breakdown voltage, a Zener holds a near-constant voltage."},
// Transmitters & receivers
{t:"TR",q:"A superhet with a 9 MHz IF is tuned to 14.2 MHz. Which could be the local oscillator frequency?",o:["9 MHz","23.2 MHz","14.2 MHz","32.2 MHz"],a:1,e:"LO = RF ± IF: 14.2 + 9 = 23.2 MHz (or 14.2 − 9 = 5.2 MHz)."},
{t:"TR",q:"With a 9 MHz IF and the LO at 23.2 MHz, which signal frequency could cause an image?",o:["5.2 MHz","9 MHz","32.2 MHz","37.4 MHz"],a:2,e:"A signal 9 MHz above the LO also mixes to 9 MHz: 23.2 + 9 = 32.2 MHz. RF stage selectivity rejects it."},
{t:"TR",q:"The purpose of automatic gain control (AGC) is to:",o:["keep the audio output roughly constant despite varying signal strengths","set the transmit power","remove harmonics","tune the receiver automatically"],a:0,e:"AGC turns down the gain on strong signals and up on weak ones."},
{t:"TR",q:"In a filter-type SSB transmitter, what follows the balanced modulator?",o:["A sideband filter","A detector","A varicap diode","An FM discriminator"],a:0,e:"The balanced modulator gives DSB with no carrier. The sideband filter removes the unwanted sideband."},
{t:"TR",q:"On an FM transmitter, a louder audio input causes:",o:["greater frequency deviation","a higher carrier frequency","less bandwidth","more carrier amplitude"],a:0,e:"Deviation follows audio amplitude. Too much over-deviates and widens the signal."},
{t:"TR",q:"The main advantage of a crystal oscillator is:",o:["very good frequency stability","wide tuning range","high output power","low cost of changing frequency"],a:0,e:"The quartz crystal holds the frequency very steady, but it can only be pulled slightly."},
{t:"TR",q:"Which detector is used to receive SSB?",o:["Product detector with a BFO / carrier oscillator","Envelope (diode) detector alone","FM discriminator","Ratio detector"],a:0,e:"SSB needs the missing carrier reinserted, which a product detector and oscillator do."},
{t:"TR",q:"Why is a low-pass filter fitted after the PA of an HF transmitter?",o:["To reduce harmonics","To improve audio quality","To raise the output power","To lower the SWR"],a:0,e:"Harmonics are above the wanted frequency, so a low-pass filter attenuates them."},
{t:"TR",q:"Key clicks on a CW signal are caused by:",o:["keying edges that are too sharp","too slow a Morse speed","a low SWR","an excessive BFO offset"],a:0,e:"Abrupt on/off keying creates wide sidebands. Shaped rise and fall times cure it."},
{t:"TR",q:"Receiver selectivity is the ability to:",o:["separate the wanted signal from signals on nearby frequencies","receive very weak signals","keep a constant audio level","reject mains hum"],a:0,e:"Sensitivity is about weak signals. Selectivity is about adjacent ones."},
// Feeders & antennas
{t:"A",q:"Roughly how long is a quarter-wave vertical for 145 MHz?",o:["0.26 m","0.52 m","1.03 m","2.07 m"],a:1,e:"λ = 300 ÷ 145 ≈ 2.07 m, so a quarter is about 0.52 m (a little shorter in practice)."},
{t:"A",q:"The feed impedance at the centre of a half-wave dipole in free space is about:",o:["70 Ω","300 Ω","600 Ω","5 Ω"],a:0,e:"About 73 Ω, which is a reasonable match to 50 Ω coax. A folded dipole is about 300 Ω."},
{t:"A",q:"In a Yagi, compared with the driven element, the reflector is:",o:["slightly longer","slightly shorter","exactly the same length","half the length"],a:0,e:"Reflectors are longer and directors shorter. Gain is towards the directors."},
{t:"A",q:"A transmitter delivers 50 W to an antenna with 10 dB gain (ignore feeder loss). The ERP is:",o:["60 W","100 W","500 W","5000 W"],a:2,e:"10 dB = ×10, so ERP = 50 × 10 = 500 W (EX308: ERP = power × gain)."},
{t:"A",q:"An SWR of 1:1 means:",o:["no power is reflected; the load is matched","half the power is reflected","the feeder is open circuit","the antenna is not radiating"],a:0,e:"A perfect match means no reflected power and no standing waves."},
{t:"A",q:"A balun is needed when feeding a dipole with coax because:",o:["the dipole is balanced and coax is unbalanced","coax cannot carry RF","it increases the antenna gain","it changes the polarisation"],a:0,e:"BALanced to UNbalanced. It also stops current flowing on the outside of the braid."},
// Propagation
{t:"P",q:"Around sunspot maximum, the maximum usable frequency (MUF) tends to be:",o:["higher","lower","unchanged","zero at night only"],a:0,e:"More ionisation refracts higher frequencies, so 10 m and 12 m open up more often."},
{t:"P",q:"The skip zone is the region:",o:["between where ground wave fades and where the first sky wave returns","right next to the transmitter","beyond the radio horizon on VHF","where signals are always strongest"],a:0,e:"In the skip zone there's no ground wave and no sky wave, so the signal can't be heard."},
{t:"P",q:"Why does long-distance 80 m and 160 m operation improve at night?",o:["The D layer disappears, so absorption falls","The F layer disappears","Sunspots increase at night","Ground wave doubles at night"],a:0,e:"Daytime D-layer absorption hits lower HF hardest. At night it fades away."},
{t:"P",q:"Tropospheric ducting on VHF/UHF is usually linked with:",o:["temperature inversions in stable high pressure","solar flares","the D layer","thunderstorms only"],a:0,e:"A warm layer above cooler air can trap VHF/UHF signals for hundreds of kilometres."},
{t:"P",q:"Sporadic E openings on 28 MHz and 50 MHz are most common:",o:["in late spring and summer","in midwinter only","at sunspot minimum only","at midnight in winter"],a:0,e:"Dense patches of E-layer ionisation appear mostly from May to August."},
// EMC
{t:"E",q:"What is the third harmonic of 144.5 MHz?",o:["289 MHz","433.5 MHz","48.2 MHz","578 MHz"],a:1,e:"3 × 144.5 = 433.5 MHz, which is inside the 70 cm band."},
{t:"E",q:"A ferrite choke on a TV's aerial lead mainly reduces:",o:["common-mode RF on the outside of the cable","the wanted TV signal","mains hum","harmonics at the transmitter"],a:0,e:"Common-mode current on the braid is a common route for breakthrough. The wanted signal is inside the coax and isn't affected."},
{t:"E",q:"Your fundamental signal overloads a neighbour's equipment, but no harmonics are present. The best cure is usually:",o:["filtering at the affected equipment","a low-pass filter at your transmitter","changing to FM","raising your antenna feed impedance"],a:0,e:"This is an immunity problem, so the cure goes on the victim device. A transmitter LPF only helps with harmonics."},
{t:"E",q:"Interference that appears only when you transmit on one band could point to:",o:["a harmonic or the fundamental falling on a frequency the victim uses","mains hum","a fault in the victim's power switch","the time of day"],a:0,e:"Logging which bands cause trouble helps identify the mechanism."},
// Operating
{t:"O",q:"Which Q-code asks \"Is this frequency in use?\"",o:["QRL?","QRZ?","QTH?","QSY?"],a:0,e:"QRL? is used before calling, especially on CW."},
{t:"O",q:"UK 70 cm FM repeaters most commonly use a shift of:",o:["600 kHz","1.6 MHz","7.6 MHz","9 MHz"],a:1,e:"2 m repeaters use 600 kHz and 70 cm repeaters usually 1.6 MHz."},
{t:"O",q:"The UK is in which IARU region?",o:["Region 1","Region 2","Region 3","Region 4"],a:0,e:"Region 1 = Europe, Africa, Middle East. Region 2 = the Americas. Region 3 = Asia-Pacific."},
{t:"O",q:"A station signing VK2ABC is in:",o:["Australia","Canada","Japan","New Zealand"],a:0,e:"VK = Australia, VE = Canada, JA = Japan, ZL = New Zealand."},
// Safety
{t:"S",q:"A residual current device (RCD) trips when it detects:",o:["an imbalance between live and neutral currents (leakage to earth)","any current over 13 A","high RF levels","low mains voltage"],a:0,e:"Typically 30 mA of leakage trips it fast enough to help prevent a fatal shock."},
{t:"S",q:"Why should lead-acid batteries be charged in a ventilated area?",o:["They can give off explosive hydrogen gas","It keeps the charger cool","It improves the battery's capacity","To reduce RF interference"],a:0,e:"Charging releases hydrogen, which can ignite."},
{t:"S",q:"If a lithium battery's terminals are short-circuited:",o:["very high current can flow, causing heat and fire","nothing happens","it recharges itself","the voltage doubles"],a:0,e:"Lithium cells have low internal resistance, so a short can cause fire. Fuse the leads and protect the terminals."},
{t:"S",q:"Before connecting an external RF earth at a house with a PME supply, you should:",o:["get advice, because faults can cause dangerous currents on the bonding","connect it to the gas pipe instead","simply bond it to the mains earth","use a thinner wire"],a:0,e:"With PME, a supply fault can raise the earth potential. RSGB and IET guidance covers how to do it safely."},

{t:"M",q:"A resistor is banded brown, black, red, gold. Its value is:",o:["10 Ω, 5%","100 Ω, 5%","1 kΩ, 5%","1 kΩ, 10%"],a:2,e:"Brown 1, black 0, red ×100 = 1000 Ω. Gold is 5% (EX308 colour code)."},

{t:"M",q:"100 W expressed in dBW is:",o:["10 dBW","20 dBW","30 dBW","100 dBW"],a:1,e:"10 × log₁₀(100) = 20 dBW, as shown in EX308 next to the 100 W limit."},
{t:"M",q:"A dummy load is used to:",o:["test a transmitter without radiating a signal","measure antenna gain","receive weak signals","act as a reflector"],a:0,e:"It's a non-reactive 50 Ω resistor that absorbs the power as heat."},
{t:"M",q:"An absorption wavemeter is useful for:",o:["checking roughly which band a signal is on and looking for harmonics","measuring resistance","measuring DC voltage","checking battery capacity"],a:0,e:"A tuned circuit with a meter peaks when it's tuned near the signal frequency."},
{t:"M",q:"A dull, grainy-looking solder joint is probably:",o:["a dry joint","a perfect joint","over-fluxed but fine","a cold-forged joint"],a:0,e:"A good joint is shiny and smooth. A dull, grainy one may not be making proper contact."}

[4,"You are a passenger onboard a non-UK registered vessel at sea and",["you are licenced to transmit only on the 2m/70cm bands.","you are permitted to transmit on all UK Amateur bands.","your Licence does not permit you to transmit any data modes.","your Licence does not permit you to transmit on Amateur Bands."],3,"RSGB's key gives D. Your UK licence doesn't authorise you to transmit on the amateur bands from a vessel that isn't UK-registered."],
[4,"Who, in the course of their employment, may ask you to send a message?",["The Captain of a tour boat.","A member of a User Service.","The Leader of a mountain climbing group.","A National Express coach driver."],1,"User Services are the bodies named in the licence (emergency services, the British Red Cross and so on). Their members may ask you to pass messages."],
[4,"An Intermediate licence holder must ensure that his station does NOT cause",["undue interference to any electrical equipment.","undue interference to other radio equipment.","any interference to any electrical equipment.","any interference to other radio users."],1,"The licence wording is \"undue interference\" to other radio users and equipment. You can't guarantee zero interference to everything."],
[4,"A transceiver controlled remotely at a place other than the Licensees recorded address must have displayed adjacent to it",["A warning not to touch the controls.","The Licensees callsign.","The Licensees Licence Number.","The Licensees name and address."],2,"RSGB's key gives the licence number. That lets anyone who finds the equipment identify the licence it's operated under."],
[4,"It is necessary to repeat the EMF compliance assessment whenever the",["transmitter has been completely disconnected.","amateur licence is renewed.","layout in the shack is changed.","antenna is replaced with a different type."],3,"The assessment depends on power, antenna gain and where the antenna is. A different antenna changes the field pattern, so reassess."],
[4,"Which one of the following frequency bands is given secondary status to Intermediate licensees?",["3.500-3.800MHz.","10.100-10.150MHz.","28.000-29.700MHz.","21.000-21.450MHz."],1,"Look it up in Schedule 1 (EX308): 10.100–10.150 MHz (30 m) is Secondary. The others are Primary."],
[4,"What is the resistance of a parallel combination of 1.8kΩ , 2.7kΩ , and a 3.3kΩ resistors?",["2.6kΩ.","813Ω.","7.8kΩ.","2.7kΩ."],1,"1/R = 1/1.8 + 1/2.7 + 1/3.3 = 0.556 + 0.370 + 0.303 = 1.229, so R = 0.813 kΩ. Parallel is always less than the smallest resistor."],
[4,"The circuit diagram shows three resistors being used as a potential divider. Each resistor has an identical value, and you may assume that there is no current being drawn from P. The potential at P is",["4 Volts.","36 Volts.","0 Volts.","8 Volts."],3,"Each equal resistor drops 4 V. P sits above R2 and R3, so it is 2 × 4 = 8 V above 0 V.","im1q8"],
[4,"A capacitor",["normally consists of a coil formed of a number of turns of wire.","consists of two metal plates separated by an insulating material.","can store a charge in its magnetic field.","often has a ferrite core to concentrate the field."],1,"Two plates and a dielectric. It stores energy in an electric field. Coils, ferrite cores and magnetic fields describe inductors."],
[4,"Which ONE of the statements below about an inductor is true?",["It blocks direct current but allows alternating current to flow.","It consists of two metal plates separated by an insulating material.","It is able to store an electric charge.","It is normally a coil of wire with several turns."],3,"An inductor is a coil. It passes DC and opposes AC, the opposite of a capacitor."],
[4,"A capacitor will",["limit direct current to a safe value.","allow AC to flow but block DC.","block AC but allow DC to flow.","charge up on AC but discharge on DC."],1,"The dielectric blocks DC, but AC passes as the capacitor repeatedly charges and discharges."],
[4,"The Reactance of a capacitor is measured in Ohms because it",["is the relationship of potential difference and current.","results in the production of heat like a resistor.","is the relationship of alternating current and heat.","is the same as resistance which is measured in Ohms."],0,"Reactance is V ÷ I, just like resistance, so it's in ohms. Unlike a resistor, an ideal capacitor doesn't produce heat."],
[4,"A half wave dipole antenna is 10m long. It is designed to operate at a frequency of",["3.5MHz.","14MHz.","29MHz.","7MHz."],1,"Half wave = 10 m, so λ = 20 m. f = 300 ÷ 20 = 15 MHz. The nearest answer is 14 MHz (real dipoles are a little shorter than λ/2)."],
[4,"The drawing shows two digitised sine waves. The sine wave on the right",["requires more binary bits to represent it.","requires fewer binary bits to represent it.","allows each binary bit to have more levels.","allows each binary bit to have fewer level."],0,"The right-hand wave has finer steps, meaning more quantisation levels, which needs more bits per sample. A bit can only ever be 0 or 1.","im1q14"],
[4,"What is the purpose of the iron core in a transformer?",["To concentrate the magnetic field.","To provide stability to the transformer.","To provide capacitance.","To reduce the magnetic field."],0,"The core concentrates the magnetic field, so more of the primary's flux links with the secondary."],
[4,"A tuned circuit consists of a",["resistor and an inductor.","capacitor and a resistor.","resistor and a transistor.","capacitor and an inductor."],3,"L and C together resonate at f = 1 / (2π√LC)."],
[4,"Which one of the following components is used to change alternating current to direct current?",["Transformer.","Diode.","Polarised capacitor.","Inductor."],1,"A diode only conducts one way, so it rectifies AC into DC."],
[4,"Providing a transistor with the correct DC voltages and currents to allow it to function is called",["biasing.","field effecting.","switching.","amplifying."],0,"Bias sets the transistor's DC operating point so it can amplify the signal properly."],
[4,"Rechargeable batteries are often marked with a value quoted in Ampere-hours. What does this value mean.",["An indication of the stored energy when fully charged.","The time after which the battery should be recharged.","The time for which the battery will power the connected device.","The maximum charging current at which the battery can be safely charged."],0,"Ah is capacity: a 7 Ah battery can supply 1 A for about 7 hours, or 7 A for about 1 hour. How long it lasts depends on the load."],
[4,"The photograph shows an electronic component often referred to as a",["semiconductor device.","integrated circuit.","surface mount component.","monolithic device."],1,"A black package with a row of legs is an integrated circuit (here a single-in-line package). Its leads go through holes, so it isn't surface mount.","im1q20"],
[4,"The Peak Deviation of an FM modulated transmission can be defined as the",["frequency of transmission divided by the frequency of the modulating signal.","maximum change from the centre frequency of transmission at the amplitude peaks of the modulating signal.","frequency of the modulating signal divided by the frequency of transmission.","maximum change from the centre frequency of transmission at the maximum frequency of the modulating signal."],1,"FM deviation follows the audio's amplitude (loudness), not its frequency. Peak deviation is the largest swing at the audio peaks."],
[4,"The output from a balanced modulator contains",["the carrier modulated with the audio modulating signal.","two sidebands but with the carrier suppressed.","two sidebands but only one of which is modulated.","one modulated sideband with the carrier suppressed."],1,"A balanced modulator gives DSB with the carrier suppressed. A sideband filter then removes one sideband to leave SSB."],
[4,"Harmonics are",["multiples of the fundamental frequency.","multiple reflections from the ionosphere.","interference from natural sources.","sporadic mixing products in a transmitter."],0,"Harmonics are whole-number multiples: 7 MHz has harmonics at 14, 21, 28 MHz and so on."],
[4,"The drawing shows an incomplete block diagram of an analogue receiver. At which point should the detector block be inserted?",["Point 2.","Point 4.","Point 3.","Point 1."],2,"The detector recovers audio from RF, so it goes between the RF amplifier and the audio amplifier: point 3.","im1q24"],
[4,"In the medium wave band up to 3MHz a crystal diode receiver can work adequately. Above that it is necessary to move to a superhet architecture. Why?",["Achieving sufficient gain at higher frequencies is not easy.","A crystal diode receiver does not have adequate selectivity at higher frequencies.","Radio noise gets worse at higher frequencies and needs to be filtered out.","It is not possible to provide automatic gain control in a crystal diode receiver."],1,"A single tuned circuit's bandwidth grows with frequency, so it can't separate close signals at HF. The superhet does its selectivity at a fixed IF."],
[4,"The demodulator for a CW receiver requires",["an audio oscillator","a beat frequency oscillator.","a frequency discriminator.","a narrow band pass filter."],1,"The BFO beats with the CW carrier to make an audible tone. A discriminator is for FM."],
[4,"A receiver can display the spectrum of the amateur band to which it is tuned. This display is produced by",["sampling the audio signal as the receiver is tuned.","a Fourier transform process within the receiver.","mixing with the original radio frequency signal.","variable tuned circuits in the IF stage of the receiver."],1,"A Fourier transform (FFT) converts the sampled signal from the time domain to the frequency domain, which gives the panadapter display."],
[4,"A balanced feeder does NOT radiate because",["the RF field only exists between the conductors.","standing waves cannot leave the feeder.","the equal and opposite RF fields cancel each other out.","the outer insulation acts as a screen ."],2,"The two wires carry equal and opposite currents, so their fields cancel. That's why balanced feeder needs no screen."],
[4,"The beam width of a Yagi antenna is the",["average width of the reflector and director elements.","thickness of the load bearing pole.","angle between the half power points of the radiated RF.","length of the RF driven element."],2,"Beam width is measured between the −3 dB (half-power) points of the main lobe."],
[4,"To which element of a Yagi antenna is the feeder connected?",["Dish reflector.","Director element.","Colinear element.","Driven element."],3,"Only the driven element is fed. Reflectors and directors are parasitic."],
[4,"A standing wave on a feeder is caused by",["RF power being transmitted from the feeder.","power being radiated from the antenna.","a combination of the RF from the transmitter and that reflected from the antenna.","RF current flowing down the coax braid."],2,"Forward and reflected waves add and cancel at fixed points along the line, creating standing waves. That happens when the antenna isn't matched."],
[4,"Which factor has the greatest effect on the maximum range of ground wave propagation?",["Frequency.","Ducting.","Sunspot cycle.","Time of day."],0,"Ground losses rise with frequency, so ground wave goes much further on LF/MF than on HF."],
[4,"The ionisation of layers within the ionosphere is caused by",["areas of high pressure.","solar radiation.","the rotation of the earth.","lightning discharges."],1,"UV and X-rays from the Sun ionise the upper atmosphere."],
[4,"The four statements below refer to the 'D' layer of the ionosphere. Which statement is correct?",["The layer absorbs some HF radio signals during the day.","The layer disappears after midnight.","The layer reflects some HF radio signals at night.","The layer is so weak that it has little effect on HF radio signals at any time."],0,"The D layer absorbs lower HF signals during daylight. It fades soon after sunset, not at midnight, which is why 160 m and 80 m open up at night."],
[4,"Which one of the following is capable of radiating and absorbing radio frequency energy?",["Only television receivers.","All electronic equipment.","Only broadcast radio receivers.","Only amateur transceivers."],1,"Any electronic equipment can emit RF and pick it up. That's what EMC is about."],
[4,"Which mode of transmission is most likely to induce speech like sounds in audio equipment or landline phones?",["SSB.","FM.","CW.","PSK."],0,"SSB's amplitude follows your voice, so rectification in audio circuits recovers distorted speech. FM's constant amplitude doesn't."],
[4,"Signals from an HF transmitter can often be prevented from causing interference to a UHF television by fitting a",["low-pass filter at the TV aerial socket.","high-pass filter at the transmitter.","high-pass filter at the TV aerial socket.","low-pass filter to the external TV aerial."],2,"A high-pass filter at the TV passes UHF TV signals and blocks the lower-frequency HF signal."],
[4,"The correct cable to use between the microphone and the transmitter would be",["twisted twin flex.","screened cable.","50Ω coaxial cable.","3-core twin and earth cable."],1,"Screened audio cable stops RF in the shack from getting into the low-level mic signal."],
[4,"Which of the following is a call sign prefix of a station in the United States of America?",["VE.","W.","I.","E."],1,"W (also K, N and AA–AL) = USA. VE = Canada, I = Italy, E = Spain (EA)."],
[4,"The Q code QRT means",["where are you?","change frequency.","increase power.","stop transmitting."],3,"QRT = stop sending / closing down. QSY = change frequency, QRO = increase power."],
[4,"What is the purpose of a high value resistor connected across a high voltage capacitor?",["To increase the current carrying capacity of the component.","To dampen any parasitic oscillation .","To limit the power supply current to a safe value.","To prevent electric shock after switch off."],3,"A bleeder resistor discharges the capacitor after switch-off, so it can't give you a shock."],
[4,"The most serious result of careless use of a screwdriver is that",["the screw slot may be damaged.","an injury may be caused.","the screwdriver may break.","the work may be scratched."],1,"Personal injury is always the most serious outcome."],
[4,"When transmitting from a stationary vehicle it is essential to consider",["the need to give your location correct to within 5km.","whether pedestrians might be inside the EMF compliance distance.","the possibility that passengers’ voices may also be transmitted.","the risk of interference from the vehicle’s ignition system."],1,"When parked, people can walk up close to the antenna, so check they can't come within your EMF compliance distance."],
[4,"When using a multimeter to measure resistance the switch should be set to",["volts AC.","volts DC.","ohms.","current."],2,"Use the ohms range, with the component unpowered."],
[4,"The gain of an antenna can be expressed in",["Volts per metre.","Amps per metre.","dB.","MHz."],2,"Antenna gain is a ratio, usually in dBi or dBd. V/m is field strength."],
[4,"A resistor is colour coded yellow, violet, orange, silver. What is its nominal resistance?",["473Ω.","47000Ω.","4700Ω.","47Ω."],1,"Yellow 4, violet 7, orange ×1000 → 47,000 Ω (47 kΩ). Silver is the 10% tolerance band."],
// Mock 2 (paper 5)
[5,"If an Intermediate licensee visits the home of a Full licensee and is transmitting using a power of 200W then the Intermediate Licensee",["is operating illegally.","may use the call sign of the Full licensee but do not need to be supervised.","may use their own call sign but be supervised by the Full licensee.","must use the call sign of and be supervised by the Full licensee."],3,"200 W is beyond the Intermediate limit of 100 W, so you're working under the Full licensee's licence: their callsign, under their supervision."],
[5,"As a service to the community, amateurs are permitted to pass messages on behalf of",["User Services.","a security guard on a building site.","an RSPCA officer.","The Automobile Association."],0,"Only the User Services named in the licence, such as the emergency services and British Red Cross."],
[5,"Who may require the amateur to reduce the level of any emissions causing undue interference?",["A Police officer.","The person suffering from the interference.","An officer authorised by the Local Authority.","A person authorised by Ofcom."],3,"Only a person authorised by Ofcom can require you to change, reduce or stop transmissions."],
[5,"A link used for the remote control of a transceiver",["can be freely used by other amateurs.","can be encrypted by a recognised protocol.","must use a terrestrial communication link.","must be adequately secure to prevent other use."],3,"The control link must be secure so nobody else can take control of your station."],
[5,"What are the average and peak powers above which a full EMF compliance check needs to be carried out?",["Average 5W EIRP, Peak 50W EIRP.","Average 10W EIRP, Peak 100W EIRP.","Average 5W ERP, Peak 50W ERP.","Average 10W ERP, Peak 100W ERP."],1,"The thresholds are 10 W EIRP average and 100 W EIRP peak. Note it's EIRP, not ERP."],
[5,"On which band is there a limit specified on the maximum effective radiated power?",["438.0-440.0MHz.","10.100-10.150MHz.","1.850-2.000MHz.","0.1357-0.1378MHz."],3,"In Schedule 1 (EX308), 135.7–137.8 kHz is limited to 1 W ERP. The others are given as PEP."],
[5,"In the circuit shown R1 is 200Ω and R2 is 600Ω. A voltage of 4V is measured across the 200Ω resistor, what is the supply voltage V of the battery?",["16V.","8V.","12V.","4V."],0,"I = 4 ÷ 200 = 20 mA. V = 0.02 × (200 + 600) = 16 V. Or by ratio: R2 is 3 × R1, so it drops 12 V, giving 4 + 12 = 16 V.","im2q7"],
[5,"The voltage measured across the terminals of a battery drops when current flows because of the",["internal resistance of the battery.","heating effect of the current.","PN boundaries in the battery.","effect of connecting the probes of the meter."],0,"Current through the internal resistance drops some voltage inside the battery, so less appears at the terminals."],
[5,"What is the capacitance between points A and B in the circuit shown?",["1.6µF.","2.5µF.","4µF.","10µF."],2,"Two 4 µF in series = 2 µF. That's in parallel with 2 µF, so the total is 4 µF.","im2q9"],
[5,"Three inductors, each having an inductance of 6mH, are connected in series, with no mutual coupling. The combined value of inductance is",["18mH.","2mH.","12mH.","6mH."],0,"Inductors in series add, like resistors: 6 + 6 + 6 = 18 mH."],
[5,"The period of a 200Hz signal is",["50ms.","20ms.","200ms.","5ms."],3,"t = 1 ÷ f = 1 ÷ 200 = 0.005 s = 5 ms."],
[5,"The reactance of an inductor is given by",["IPeak/VPeak Henries.","Vrms/Irms Ohms.","Irms/Vrms Ohms.","VPeak/IPeak Henries."],1,"Reactance = V ÷ I in ohms (rms values). Henries measure inductance, not reactance."],
[5,"A long perfectly matched open wire feeder is carrying a signal of wavelength 10m. At a particular instant in time the voltage at a point on the feeder reaches its peak. What is the voltage at the same instant in time 2.5 m further along the feeder?",["Varying.","The positive peak.","The negative peak.","Zero."],3,"2.5 m is a quarter wavelength, which is 90° of phase. A quarter cycle on from a peak, the sine wave crosses zero."],
[5,"The minimum sampling rate of an analogue signal to fully capture this signal is known as the",["Fourier rate.","Nyquist rate.","Digital rate.","Frequency rate."],1,"The Nyquist rate is twice the highest frequency in the signal."],
[5,"A mains transformer has a primary coil of 1000 turns, and a secondary coil of 60 turns. Which ONE of the following statements about the transformer is true?",["It should be used with a 13A fuse.","It should be used with a 3A fuse.","It is a step down transformer.","It is a step up transformer."],2,"Fewer secondary turns means a lower output voltage, so it steps down (230 V → about 14 V)."],
[5,"A series resonant circuit",["consists of a resistor and inductor.","has a minimum impedance at a particular frequency.","consists of a resistor and capacitor.","has a high impedance at a particular frequency."],1,"At resonance, series L and C reactances cancel, leaving minimum impedance. A parallel tuned circuit is the opposite (maximum)."],
[5,"In a variable capacitance diode the capacitance depends on the",["frequency.","forward current.","reverse voltage.","reverse current."],2,"Increasing the reverse bias widens the depletion layer and lowers the capacitance."],
[5,"A transistor used to generate audio or radio frequencies is operating as",["a detector.","a filter.","a tuner.","an oscillator."],3,"An amplifier with positive feedback through a tuned circuit makes an oscillator."],
[5,"The designer of a mains power supply has a choice of using either a half wave, a full wave, or a bridge rectifier. Which would require a higher value reservoir capacitor for the same degree of smoothing?",["All require the same value reservoir capacitor.","The half wave rectifier.","The full wave rectifier.","The bridge rectifier."],1,"Half wave charges the capacitor only 50 times a second instead of 100, so it must hold up the voltage for twice as long."],
[5,"A particular feature of an integrated circuit linear power supply is that",["most of the control functions are contained within a single device containing several transistors.","the voltage stabilisation functions are carried out using a number of individual transistors and other components.","the mains supply is rectified and converted to 20kHz or higher frequency pulses.","a transformer made of a ferrite material is used to save space, weight and simplify smoothing."],0,"An IC regulator (such as a 7812) puts the reference, error amplifier and pass transistor in one package. C and D describe a switch-mode supply."],
[5,"The block diagram shows a simple Morse (CW) transmitter. What is the name of block W?",["Modulator.","Power amplifier.","AF amplifier.","Sideband filter."],1,"Oscillator → keying → power amplifier → low-pass filter → antenna. CW needs no modulator or audio stage.","im2q21"],
[5,"Sideband filters are of a type called",["band stop filters.","band pass filters.","high pass filters.","low pass filters."],1,"A sideband filter passes one sideband's band of frequencies (about 2.4 kHz wide) and rejects the rest."],
[5,"The drawings show the transmitted waveform of a CW transmitter sending the letter R. Which waveform will result in the minimum transmitted bandwidth?",["waveform 4.","waveform 1.","waveform 3.","waveform 2."],3,"Waveform 2 has smoothly shaped rise and fall. Hard, square edges (1 and 3) or a sharp edge (4) cause key clicks and a wider signal.","im2q23"],
[5,"If the receiver is tuned to a very strong RF signal then it can result in",["instability in the local oscillator.","distorted audio from the receiver.","damage to the AGC circuit.","muting in the audio amplifier of the receiver."],1,"A very strong signal can overload the RF or IF stages, which distorts the audio."],
[5,"The intermediate frequency can be the",["difference between the RF and the local oscillator frequencies.","sum of the RF and the audio frequencies.","difference between the audio and the local oscillator frequencies.","sum of the audio and the local oscillator frequencies."],0,"The mixer produces RF ± LO. The IF is one of these, usually the difference."],
[5,"The S-meter in a receiver normally relies on a signal derived from the",["AGC voltage from the detector","front end RF amplifier.","strength of the audio signal.","biasing of the first mixer."],0,"The AGC voltage rises with signal strength, so it also drives the S-meter."],
[5,"A sine wave and a harmonic are shown at the top of the drawing. Below are four representations in the frequency domain. Which one corresponds to the waveform shown?",["1.","2.","3.","4."],0,"The fundamental (one cycle in 1 ms, so 1 kHz) is the larger dashed wave. The dotted wave is its 2nd harmonic at 2 kHz with smaller amplitude. Display 1 shows a tall line at 1 kHz and a shorter one at 2 kHz.","im2q27"],
[5,"One advantage of using twin feeder over coaxial feeder is that it",["has a lower loss than coaxial feeder.","has an earth lead for safety.","has a higher loss than coaxial feeder.","is screened to prevent radiation."],0,"Open-wire and ladder line have much lower loss than coax, especially at high SWR."],
[5,"An isotropic radiator is",["real and has measurable dimensions.","a theoretical point source of equal radiation in all directions.","said to have a gain of 2.15 dB compared to a dipole.","used only in the troposphere."],1,"It's a theoretical reference (0 dBi). A dipole has 2.15 dB gain over isotropic, not the other way round."],
[5,"A three element triband Yagi antenna will have",["three parasitic elements and an RF driven dipole.","harmonically related feedpoint impedances.","twelve parallel tuned circuits.","an automatic ATU at the feedpoint."],2,"Each element needs 2 traps per side to cover 3 bands, which is 4 traps per element. 3 elements × 4 = 12 traps, each a parallel tuned circuit."],
[5,"The single most important reason for using a PL259 plug and SO239 socket to connect an antenna feeder to a transceiver is to",["minimise the chance of accidental disconnection .","contain the RF signal within the connection .","ensure electrical contact is only made via soldered joints.","match 75Ω feeder to the 50Ω output of the transceiver."],1,"Coaxial connectors keep the screen continuous, so RF stays inside the feeder system."],
[5,"The direction of propagation of an electromagnetic wave is",["at right-angles to both electric and magnetic fields.","at right angles to the electric field only.","parallel to electric field.","parallel to the magnetic field."],0,"The E and H fields are at right angles to each other and to the direction of travel."],
[5,"Which one of the following affects the propagation of high frequency (HF) radio waves?",["The average barometric pressure at any point along the path in question .","The maximum barometric pressure at any point along the path in question .","The state of the sun-spot cycle.","The maximum height of any mountain ranges over which they travel."],2,"Sunspot activity controls ionisation and so the MUF. Pressure matters for VHF/UHF tropospheric propagation."],
[5,"The greatest range of a radio wave by means of a single hop via the E layer is approximately",["2,000km.","5,000km.","15,000km.","10,000km."],0,"The E layer is about 100 km up, which gives up to about 2000 km per hop. The F2 layer gives about 4000 km."],
[5,"The immunity of a receiving device can be improved by",["screening the transmitter.","filtering power, signal and control leads.","transmitting on a lower frequency.","transmitting on lower power."],1,"Immunity belongs to the victim device. Filtering its leads stops RF getting in. The other options change the transmitter, not the receiver's immunity."],
[5,"Interference to an amateur receiver from a vacuum cleaner would take the form of a",["rough sounding continuous noise.","50Hz hum.","low pitched musical tone.","high pitched musical tone."],0,"Brush motors spark continuously, which you hear as rough broadband noise."],
[5,"Fitting a choke or balun on a feeder can be used to attenuate",["common mode currents.","differential mode currents.","direct currents.","balanced currents."],0,"Chokes block common-mode current (flowing the same way on both conductors, such as on the outside of the braid). The wanted differential signal passes through."],
[5,"Which one of the following constitutes a good RF earth?",["A connection to an earth stake.","A connection to the domestic water pipe.","A connection to the mains earth.","A connection to the domestic gas pipe."],0,"Use a dedicated earth stake with a short, thick lead. Never use gas pipes, and take care with PME mains earths."],
[5,"Amateur radio contests generally require",["membership of the RSGB.","production of QSL cards confirming all contacts.","operation from remote locations.","the correct exchange of specified information ."],3,"Contest contacts count when you exchange the required information, such as a report and serial number or locator."],
[5,"A computer sound card can be used for",["adjusting your HF receiver filters.","only receiving amateur radio signals.","controlling the transmitted frequency.","sending and receiving data signals via amateur radio."],3,"The sound card generates and decodes the audio tones for data modes such as FT8, PSK31 and RTTY."],
[5,"The fuse in a 13A plug (when purchased) is rated at 13A. Which ONE of the following is a correct statement?",["The 13A fuse maintains a constant current of 13A to the equipment.","The 13A fuse should be replaced by one that is rated just above the current drawn by the equipment.","The house fuses are adequate protection and the 13A fuse can be replaced by aluminium foil if it blows.","As the 13A fuse is the one specified for the plug it should not be changed."],1,"Pick a fuse rated just above the normal current (often 3 A or 5 A) so it protects the flex and equipment."],
[5,"It is most advisable, when using a drill to",["place the item being drilled on a flat surface.","ensure the item being drilled is securely fixed.","keep one hand on the item being drilled to prevent the drill slipping.","keep one hand in your pocket."],1,"Clamp the work. If the bit snags, an unsecured piece can spin violently."],
[5,"When transmitting from a vehicle in a stationary or slow moving queue it is a requirement to consider",["reflections off adjacent vehicles.","the increased risk of interference.","the proximity of the general public.","the adequacy of the power supply."],2,"In slow or stationary traffic, people can be close to your antenna, so think about EMF exposure."],
[5,"To measure potential difference (voltage) using a general purpose multi-meter the probes should be connected in",["parallel (across) the component under test whilst in the circuit.","series with the component under test whilst isolated from any other component.","series with the component under test whilst in the circuit.","parallel with the component under test whilst isolated from any other component."],0,"Voltage is measured across a component in a working circuit. Current is measured in series."],
[5,"A gain of 6 dB is a power multiplication of",["eight times.","four times.","ten times.","two times."],1,"3 dB = ×2, so 6 dB = ×2 × 2 = ×4."],
[5,"When soldering electronic components",["solder containing resin-based flux should not be used, as it is corrosive.","solder containing flux should be used to prevent oxidisation of the joints.","solder should be carried to a joint on the tip of the iron.","the iron should be unplugged before making each joint."],1,"Flux cleans the surfaces and stops oxidation so the solder flows. Feed solder to the heated joint, not on the iron's tip."],
// Mock 3 (paper 6)
[6,"Your own call is 2E1CYL and your friend GW1ZTZ has visited your home so you can operate at 400W under his guidance. You should use the call sign",["G1ZTZ.","2E1CYL.","GW1ZTZ.","2W1CYL."],0,"400 W needs the Full licence, so you use your friend's callsign under his supervision. The RSL follows where the station is. Your home is in England (your 2E callsign has no regional letter), so it's G1ZTZ, not GW1ZTZ."],
[6,"A member of a User Service can",["use your Radio Equipment to send messages.","permit you to transmit out of band.","close down your station.","allow use of your Radio Equipment for fund raising."],0,"User Service members may send messages using your station, with you responsible for it. They can't extend your licence or close you down."],
[6,"A licensed amateur radio station must",["be available in times of emergency.","be kept locked when not in use.","not cause undue interference to other radio users.","avoid being audibly overheard late at night."],2,"Not causing undue interference is a licence condition. The others aren't requirements."],
[6,"An amateur radio link used for the purpose of remote control of a transceiver must",["use a frequency in the 30m band.","not be encrypted.","be less than 500mW PEP.","use a different callsign to that of the main station."],1,"Per RSGB's key, a remote-control link sent over amateur radio must not be encrypted, as with any amateur transmission. It must still be secure against misuse (see RSGB Mock 2 Q4)."],
[6,"The EIRP from an amateur transmitter has been determined to be at an average power level of 8W with a peak radiated power of 120W. Which statement below correctly describes the situation in relation to the EMF restrictions in the licence?",["The average level is above the compliance limit but the peak level is above.","The average level is above the compliance limit but the peak level is below.","The average level is below the compliance limit but the peak level is below.","The average level is below the compliance limit but the peak level is above."],3,"Limits are 10 W EIRP average and 100 W EIRP peak. 8 W is below, 120 W is above, so you still need a full assessment."],
[6,"On which one of the frequencies below, amateurs must accept interference from ISM users (Industrial Scientific and Medical)",["1.860MHz.","2350MHz.","431.5MHz.","5840MHz."],3,"In EX308, the 5830–5850 MHz entry says users must accept interference from ISM users. 2350 MHz is only non-interference."],
[6,"In the circuit shown R1 is 200Ω and R2 is 600Ω. A voltage of 4V is measured across the 200Ω resistor, what is the voltage across R2?",["16V.","8V.","4V.","12V."],3,"I = 4 ÷ 200 = 20 mA. V(R2) = 0.02 × 600 = 12 V.","im3q7"],
[6,"A transceiver in a shed is fed from a lead from a stabilised supply in the house. On low power transmit the current drawn is 1A and the terminal voltage at the rig is 13.2V. On high power it drops to 12.4V at a current of 5A. What is the terminal voltage on receive when the current is negligible?",["13.2V.","13.6V.","13.4V.","13.8V."],2,"An extra 4 A drops 0.8 V, so the lead is 0.2 Ω. At 1 A it drops 0.2 V, so with no current the voltage is 13.2 + 0.2 = 13.4 V."],
[6,"Polarised capacitors",["are usually very small.","have two identical and unmarked connections.","can be fitted either way round.","must be fitted the correct way round."],3,"Electrolytics are polarised. Fitted backwards, they can fail, sometimes violently."],
[6,"A coil can have its inductance increased by",["reducing the number of turns.","reducing the spacing between the turns.","mounting it vertically instead of horizontally.","reducing the diameter of the coil."],1,"Closer turns link more flux, which raises inductance. More turns, a larger diameter or a ferrite core also increase it."],
[6,"Which of the following signals would have the most heating effect when applied to a 50Ω non-reactive load?",["10V DC.","12V peak AC at 60Hz.","9V rms AC at 400Hz.","20V peak to peak AC at 50Hz."],0,"Compare rms values: 10 V DC; 12 V peak = 8.5 V rms; 9 V rms; 20 V p-p = 10 V peak = 7.1 V rms. 10 V DC is highest."],
[6,"The term 'impedance' may be used when",["relating voltage to current in an AC circuit.","using a test meter to measure resistors.","considering the current drawn from a battery.","noting the field strength of a received radio signal."],0,"Impedance is the AC ratio of V to I, combining resistance and reactance."],
[6,"A frequency of 432.675MHz is in the",["2m band.","70cm band.","35cm band.","7m band."],1,"λ = 300 ÷ 432.675 ≈ 0.69 m, which is the 70 cm band (430–440 MHz)."],
[6,"In a sampled system the minimum sampling rate for a given signal should be.",["half the Nyquist rate.","equal to the Nyquist rate.","twice the Nyquist rate.","greater than the Nyquist rate."],1,"The Nyquist rate already is twice the highest signal frequency, so it is the minimum. Don't double it again."],
[6,"A transformer",["can only be used with AC.","always has an iron core.","will change DC voltages.","will change one alternating frequency to another."],0,"A transformer needs a changing magnetic field, so it only works on AC. RF transformers often have air or ferrite cores."],
[6,"Energy can readily transfer between a capacitor and an inductor at a frequency known as the",["radio frequency.","maximum usable frequency.","rejection frequency.","resonant frequency."],3,"At resonance, energy swaps back and forth between the capacitor's electric field and the inductor's magnetic field."],
[6,"The current gain ß of a transistor is defined as",["IE/IC.","IC/IE.","IC/IB.","IB/IC."],2,"β = collector current ÷ base current (EX308: Ic = βIb)."],
[6,"Which circuit diagram is that of a common emitter amplifier?",["Circuit 1.","Circuit 2.","Circuit 3.","Circuit 4."],2,"In a common emitter amplifier the input goes to the base, the output comes from the collector, and the emitter is decoupled to 0 V for AC. That's circuit 3.","im3q18"],
[6,"Which ONE of the following components provides smoothing in a mains power supply unit?",["Fuse.","Capacitor.","Rectifier.","Transformer."],1,"The reservoir capacitor fills in the gaps between rectified pulses."],
[6,"The diagram is that of a power supply which",["uses a switched mode technology to reduce the weight, cost and size of the overall unit.","uses a ferrite transformer normally operating well above the 50Hz mains frequency.","is linear in operation with the regulation functions carried out by individual components","is linear and with most of the regulation functions carried out in an integrated circuit."],3,"It has a mains transformer, a bridge rectifier, a reservoir capacitor C1 and a regulator IC1. That's a linear IC-regulated supply.","im3q20"],
[6,"Which of the following is the main advantage of a variable frequency oscillator?",["The frequency is able to be pulled.","The frequency will be very stable on a single channel.","The frequency is pre-set.","The frequency is able to be changed."],3,"A VFO can be tuned. Crystal oscillators are more stable but fixed."],
[6,"Frequency modulation can be generated by",["mixing AF and RF signals in a balanced modulator.","applying an AF signal to the DC power supply to the power amplifier.","applying an AF signal to a variable capacitance diode connected to an oscillator circuit.","keying a CW transmitter at a specific frequency."],2,"The audio varies the varicap's capacitance, which shifts the oscillator frequency. A balanced modulator gives DSB, and modulating the PA supply gives AM."],
[6,"Which ONE of the following frequency/amplitude diagrams shows the effect of a band pass filter?",["Diagram 4.","Diagram 3.","Diagram 2.","Diagram 1."],2,"Diagram 2 passes a band in the middle. 1 is band-stop (notch), 3 is high-pass, 4 is low-pass.","im3q23"],
[6,"If the tuning sections of a radio receiver have a relatively low Q-factor then",["adjacent RF signals are more likely to interfere with the wanted signal.","adjacent RF signals are less likely to interfere with the wanted signal.","careful tuning is essential to pick up all the wanted signal.","background radio frequency noise will be markedly reduced."],0,"Low Q means a wide bandwidth and poor selectivity, so nearby signals get through."],
[6,"In a superhet radio receiver, the RF amplifier",["selects the mode of the wanted signal.","changes the frequency of the wanted signal to the intermediate frequency.","selects a range of signals including the wanted signal.","selects only the wanted signal."],2,"The RF stage's tuning is broad. The narrow selectivity comes from the IF filter. The mixer does the frequency change."],
[6,"A receiver is being used to receive a CW signal on 10MHz. The receiver IF is set to 600kHz. The BFO frequency could be",["599.3kHz","10MHz.","610kHz.","600kHz."],0,"The BFO sits near the IF so the beat is audible: 600 − 599.3 = 0.7 kHz (a 700 Hz tone). Exactly 600 kHz gives zero beat, and 610 kHz gives 10 kHz, which is too high."],
[6,"An SDR receiver is shown in the diagram. What function is performed in the blank box?",["Fourier transform.","Sampling.","Low-pass filtering.","High-pass filtering."],2,"An anti-aliasing low-pass filter before the ADC removes signals above half the sampling rate.","im3q27"],
[6,"The primary purpose of a choke balun fitted on a coaxial feeder to a Yagi antenna is to",["ensure the directivity and gain of the antenna is not impaired.","minimise the currents on the inner conductor of the feeder.","avoid any RF currents flowing down the outer braid of the feeder.","provide impedance matching to the antenna for a low SWR."],2,"It stops common-mode current on the outside of the braid, so the feeder doesn't radiate. A choke balun doesn't match impedance."],
[6,"In order to increase the signal strength to and from long distance HF stations which of the following should be reduced?",["Height of the antenna.","Feed-point impedance.","SWR on the feeder.","Vertical angle of radiation."],3,"A lower take-off angle gives longer hops, which is better for DX. Raising the antenna lowers the angle."],
[6,"A dipole antenna is fitted with a total of four traps. It should present a reasonable feed impedance on",["five bands.","four bands.","three bands.","two bands."],2,"Four traps means two on each side. That gives one band at each trap point plus the full length, so three bands."],
[6,"If an Antenna Matching Unit (AMU or ATU) is installed between the transmitter and the feeder to the antenna, and correctly adjusted it can",["reduce the feeder loss.","have no effect on the actual SWR on the feeder between the AMU and the antenna feed-point.","change the polarisation of the transmitted signal.","affect the actual SWR on the feeder between the AMU and the antenna feed-point."],1,"An ATU at the rig only shows the transmitter a 50 Ω load. The SWR on the feeder beyond it is unchanged, because that's set by the antenna."],
[6,"A signal on the 28MHz band can be heard by a listener five kilometers from the transmitter. The signal is travelling by the",["skip.","ionosphere.","ground wave.","sky wave."],2,"5 km is far too close for sky-wave skip, so it's ground wave (or direct wave)."],
[6,"A transmission that is refracted from the F2 layer can, in a single hop, reach a distance of approximately",["8000km.","16000km.","4000km.","2000km."],2,"The F2 layer is about 250–400 km up, giving about 4000 km per hop. The E layer gives about 2000 km."],
[6,"Multi-wave VHF/UHF propagation arises when",["two amateurs are transmitting on the same frequency at the same time.","signals are reflected off buildings or aircraft only when there is no direct signal path.","signals are received from ground wave and sky wave propagation.","signals are reflected off buildings or aircraft in addition to the direct path signal."],3,"Multipath happens when reflections arrive along with the direct signal. They add and cancel, causing flutter."],
[6,"New electronic equipment that meets EMC regulations is MOST likely to suffer interference if",["it is being used in a domestic environment.","it has been poorly installed.","it is poorly designed.","it does not include commercial RF filters."],1,"Compliant equipment can still pick up interference through badly routed or long leads and poor installation."],
[6,"A local amateur transmission on 435MHz is causing interference to a nearby television which has a Yagi TV aerial on the roof and a masthead amplifier connected to the downlead to the TV. It is most likely that",["a harmonic of the amateur signal is interfering with the TV signal.","the amateur signal is being picked up directly by the television.","the television mains wiring is conducting the signal into the television.","the masthead amplifier is amplifying the amateur signal and overloading the television."],3,"435 MHz is close to the UHF TV band, so a broadband masthead amp amplifies it along with TV and overloads the system."],
[6,"Which of the following could NOT be used to detect harmonics from a 3.5MHz transmitter?",["SDR dongle and associated software.","General coverage receiver.","Digital frequency meter.","Spectrum analyser."],2,"A frequency counter shows only the strongest frequency (the fundamental). It can't show harmonics alongside it."],
[6,"The most severe risk in siting an amateur transmit/ receive antenna indoors close to mains wiring is that",["noise on the mains wiring will degrade the amateur receiving capabilities.","RF energy may get into the mains wiring.","fuses may not offer sufficient protection.","the risk of the amateur equipment becoming 'live' is increased."],1,"RF coupled into the mains wiring spreads interference throughout the house and beyond."],
[6,"The International Amateur Radio Union produces",["amateur radio band plans.","the international Radio Regulations.","amateur radio examinations.","cross-border reciprocal licensing agreements."],0,"The IARU writes band plans. The ITU writes the Radio Regulations."],
[6,"Most amateur satellites",["orbit the Earth and are only in view at certain times.","remain in view of their coverage at all times.","appear to be fixed above a particular point on the Earth.","are at heights of at least 500km."],0,"Most are in low Earth orbit and pass overhead for 10–15 minutes at a time. QO-100 is the geostationary exception."],
[6,"What is the most important reason to avoid working on powered equipment?",["To avoid the possibility of unwanted transmission.","To minimise the risk of damage to the equipment.","To minimise the risk of electric shock.","To simplify the process of adjusting sensitive components."],2,"Personal safety comes first: electric shock."],
[6,"Before using an electric drill it is important to",["remove glasses and goggles.","check the chuck key has been removed.","use an undersized drill bit.","ensure the work is properly earthed."],1,"A chuck key left in will fly out when the drill starts."],
[6,"When transmitting from a stationary vehicle it is essential to consider",["the need to give your location correct to within 5km.","whether pedestrians might be inside the EMF compliance distance.","the possibility that passengers’ voices may also be transmitted.","the risk of interference from the vehicle’s ignition system."],1,"When parked, people can walk close to the antenna, so check your EMF compliance distance."],
[6,"In adjusting the tuning of a radio receiver for maximum voltage output, the best device to be used is",["an absorption wavemeter.","a digital multimeter.","a frequency counter.","an analogue multimeter."],3,"A moving needle shows peaks and trends far more clearly than changing digits."],
[6,"A power of 800W is the same as",["27dBW.","29dBW.","30dBW.","80dBW."],1,"10 × log₁₀(800) = 29.0 dBW. For comparison, 1000 W = 30 dBW."],
[6,"Soldering is a method of",["heating the flux to form a sticky compound which holds the items to be connected together.","using an iron to compress the items to be joined so they form a good tight joint.","joining wires and components by melting the copper of the items to be joined so they fuse together.","melting metal alloy with a low melting point to flow around the wires being joined."],3,"Solder is a low-melting-point alloy that flows around the heated parts and bonds them. The copper itself doesn't melt."]
];

// ---------- Level switching: each level keeps its own bank, layout, reference booklet, scores and missed list ----------
const LEVELS={
  F:{name:"Foundation",Q,T,EXAM,PAPERS,REF,n:26,pass:19,mins:60,ref:"EX307",key:"fq",
     tip:"Licence conditions carry the most marks, so they're the best place to pick up points."},
  I:{name:"Intermediate",Q:IALL,T:IT,EXAM:IEXAM,PAPERS:{1:"Random mock",4:"RSGB Mock 1",5:"RSGB Mock 2",6:"RSGB Mock 3"},REF:IREF,n:46,pass:28,mins:90,ref:"EX308",key:"iq",
     tip:"Technical aspects are 14 of the 46 marks, so that's where most points are won or lost."}
};
let LVL="F", CFG=LEVELS.F, missed=new Set();
const best={};
function bestKey(p){return LVL==="F"&&p===1?"fq-best":CFG.key+"-best-"+p}
function setLevel(l){
  if(!LEVELS[l]) l="F";
  LVL=l; CFG=LEVELS[l];
  Q=CFG.Q; T=CFG.T; EXAM=CFG.EXAM; ORDER=Object.keys(EXAM); PAPERS=CFG.PAPERS; REF=CFG.REF;
  missed=new Set(store(CFG.key+"-missed")||[]);
  for(let p=1;p<=6;p++) best[p]=store(bestKey(p));
  store("radio-level",l);
}

// ---------- State ----------
const app=document.getElementById("app");
let S=null, timer=null;
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function saveMissed(){store(CFG.key+"-missed",[...missed])}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOpts(q){const idx=shuffle([0,1,2,3]);return{...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

// ---------- Screens ----------
function home(){
  clearInterval(timer);S=null;
  const F=LVL==="F";
  const topicOpts=Object.entries(T).map(([k,v])=>`<option value="${k}">${v} (${Q.filter(q=>q.t===k).length})</option>`).join("");
  const bests=[1,2,3,4,5,6].filter(p=>best[p]!=null&&PAPERS[p]);
  app.innerHTML=`
  <div class="seg" role="group" aria-label="Exam level">
    <button class="segb" data-l="F" aria-pressed="${F}">Foundation</button>
    <button class="segb" data-l="I" aria-pressed="${!F}">Intermediate</button>
  </div>
  <header style="display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">UK amateur radio · ${CFG.name}</div>
    <h1>${CFG.name} Exam Trainer</h1>
    <p class="lede">${Q.length} questions on the syllabus v1.6b: ${F?"the three official RSGB mock papers plus original practice questions covering licence conditions, technical basics, antennas, propagation, EMC, operating and safety.":"the three official RSGB Intermediate mock papers plus original practice questions. The bank is weighted towards the technical topics, which make up a third of the paper."}</p>
  </header>
  <div class="facts"><span>Real exam: <strong>${CFG.n} questions</strong></span><span><strong>${CFG.mins} min</strong></span><span>Pass: <strong>${CFG.pass}/${CFG.n}</strong></span></div>
  ${bests.length?`<div class="facts">${bests.map(p=>`<span>${PAPERS[p]} best: <strong>${best[p]}/${CFG.n}</strong></span>`).join("")}</div>`:""}
  <section class="panel">
    <div class="topic">Official RSGB ${F?"":"Intermediate "}mock papers · syllabus v1.6b</div>
    <p class="lede" style="font-size:.95rem">The real papers, in their published order with the original diagrams. The ${CFG.ref} reference data is one tap away, as in the exam.</p>
    <div class="row">
      <button class="btn" id="p4">RSGB Mock 1</button>
      <button class="btn" id="p5">RSGB Mock 2</button>
      <button class="btn" id="p6">RSGB Mock 3</button>
    </div>
  </section>
  <div class="modes${F?"":" two"}">
    <button class="mode" id="m-exam"><b>Mock exam</b><span>A fresh random ${CFG.n} each time from every question in the trainer, RSGB mocks included. Real exam layout, ${CFG.mins}-minute clock.</span></button>
    <button class="mode" id="m-practice"><b>Practice</b><span>Instant feedback and an explanation after every answer.</span></button>
    ${F?`<button class="mode" id="m-general"><b>General knowledge</b><span>${Q.filter(q=>q.t==="G").length} wider-hobby questions: history, prefixes, slang and activities. Not in the mock exam.</span></button>`:""}
  </div>
  ${F?`<section class="panel">
    <div class="topic">More practice papers</div>
    <p class="lede" style="font-size:.95rem">Papers 2 and 3 are fixed sets of original questions laid out like the real exam, so you can compare your scores across attempts.</p>
    <div class="row">
      <button class="btn" id="p2">Mock paper 2</button>
      <button class="btn" id="p3">Mock paper 3</button>
    </div>
  </section>`:""}
  <section class="panel">
    <div class="row"><label for="topic">Practice topic</label>
    <select id="topic"><option value="all">All topics (${Q.length})</option>${topicOpts}</select></div>
    <div class="row">
      <button class="btn" id="go-practice">Start practice</button>
      <button class="btn ghost" id="go-missed" ${missed.size?"":"disabled"}>Retry missed (${missed.size})</button>
    </div>
    <div class="row"><button class="btn ghost" id="go-ref">View ${CFG.ref} reference data</button></div>
    <p class="note">${F?"In the real exam you get the EX307 booklet with the licence schedule, band plans and a dB table, so you don't need to memorise every frequency.":"In the real exam you get the EX308 booklet: the Intermediate licence schedule, the 2 m and 20 m band plans, a formula sheet and the resistor colour code. Learn how to use the formulas rather than memorising them."}</p>
  </section>
  <section class="panel ref" id="refpanel" ${refOpen?"":"hidden"}>${REF}</section>`;
  const on=(id,f)=>{const el=document.getElementById(id); if(el) el.onclick=f;};
  app.querySelectorAll(".segb").forEach(b=>b.onclick=()=>{ if(b.dataset.l===LVL) return; setLevel(b.dataset.l); refOpen=false; home(); });
  on("go-ref",()=>{refOpen=!refOpen;document.getElementById("refpanel").hidden=!refOpen;});
  [4,5,6].forEach(p=>on("p"+p,()=>startExam(p)));
  on("m-exam",()=>startExam(1));
  on("p2",()=>startExam(2));
  on("p3",()=>startExam(3));
  on("m-practice",()=>startPractice(document.getElementById("topic").value));
  on("m-general",()=>startPractice("G"));
  on("go-practice",()=>startPractice(document.getElementById("topic").value));
  on("go-missed",()=>startPractice("missed"));
}

function startExam(paper){
  let qs=[];
  if(paper===1){ const seen=new Set(); for(const k of ORDER) qs.push(...shuffle(Q.filter(q=>q.t===k)).filter(q=>!seen.has(q.q)&&seen.add(q.q)).slice(0,EXAM[k])); qs=qs.map(shuffleOpts); } // draws from every paper's questions, incl. RSGB
  else if(paper>=4) qs=Q.filter(q=>q.p===paper); // official papers: published order and lettering
  else qs=ORDER.flatMap(k=>Q.filter(q=>q.p===paper&&q.t===k)).map(shuffleOpts);
  refOpen=false;
  S={mode:"exam",paper,qs,ans:Array(qs.length).fill(null),i:0,end:Date.now()+CFG.mins*60*1000};
  timer=setInterval(tick,1000);
  render();
}
function startPractice(topic){
  let pool=topic==="all"?Q:topic==="missed"?Q.filter(q=>missed.has(q.id)):Q.filter(q=>q.t===topic);
  S={mode:"practice",qs:shuffle(pool).map(shuffleOpts),ans:[],i:0,correct:0,label:topic==="all"?"All topics":topic==="missed"?"Missed questions":T[topic]};
  render();
}
function tick(){
  const left=Math.max(0,S.end-Date.now());
  const el=document.getElementById("clock");
  if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<5*60000)}
  if(left<=0) finishExam();
}

function render(){
  const q=S.qs[S.i], n=S.qs.length, ex=S.mode==="exam";
  const picked=S.ans[S.i];
  const shown=!ex&&picked!=null;
  const pct=ex?S.ans.filter(a=>a!=null).length/n*100:(S.i+(shown?1:0))/n*100;
  app.innerHTML=`
  <div class="strip">
    <button class="btn ghost" id="quit" style="padding:6px 12px;font-size:.85rem">${ex?"Abandon":"Menu"}</button>
    <span>Q ${S.i+1}/${n}</span>
    <span class="row" style="gap:10px"><button class="btn ghost" id="ref" style="padding:6px 10px;font-size:.85rem" aria-pressed="${refOpen}">${CFG.ref}</button>${ex?`<span class="clock" id="clock">${CFG.mins}:00</span>`:`${S.correct} correct`}</span>
  </div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <section class="panel ref" id="refpanel" ${refOpen?"":"hidden"}>${REF}</section>
  <section class="panel">
    <div class="topic">${ex?esc(PAPERS[S.paper])+" · ":""}${T[q.t]}${!ex?` · ${esc(S.label)}`:""}${q.fixed&&!ex?" · RSGB mock":""}</div>
    <p class="q">${esc(q.q)}</p>
    ${q.img?`<figure class="fig"><img src="${IMG[q.img]}" alt="Diagram for this question"></figure>`:""}
    <div class="opts" role="radiogroup">
      ${q.o.map((o,j)=>{let c="opt";if(shown){if(j===q.a)c+=" right";else if(j===picked)c+=" wrong"}else if(picked===j)c+=" sel";
        return `<button class="${c}" role="radio" aria-checked="${picked===j}" ${shown?'aria-disabled="true"':""} data-j="${j}"><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></button>`}).join("")}
    </div>
    ${shown?`<div class="explain"><b>${picked===q.a?"Correct.":"Not quite."}</b> ${esc(q.e)}</div>`:""}
    <div class="row" style="justify-content:space-between">
      ${ex?`<button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Previous</button>`:"<span></span>"}
      ${ex?(S.i<n-1?`<button class="btn" id="next">Next</button>`:`<button class="btn" id="finish">Finish and mark</button>`)
          :(shown?`<button class="btn" id="next">${S.i<n-1?"Next question":"See results"}</button>`:"")}
    </div>
  </section>
  ${ex?`<section class="panel"><div class="topic">Jump to question</div><div class="grid">${S.qs.map((_,k)=>`<button class="dot ${S.ans[k]!=null?"done":""} ${k===S.i?"cur":""}" data-k="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
  <div class="row"><button class="btn ghost" id="finish2">Finish and mark</button><span class="note">${S.ans.filter(a=>a==null).length} unanswered</span></div></section>`:""}`;
  if(ex) tick();
  document.getElementById("quit").onclick=home;
  document.getElementById("ref").onclick=()=>{refOpen=!refOpen;const rp=document.getElementById("refpanel");rp.hidden=!refOpen;document.getElementById("ref").setAttribute("aria-pressed",refOpen);if(refOpen){rp.scrollTop=0;rp.scrollIntoView({block:"start"})}};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(shown)return; const j=+b.dataset.j; S.ans[S.i]=j;
    if(!ex){ if(j===q.a){S.correct++;missed.delete(q.id)}else missed.add(q.id); saveMissed(); }
    render();
  });
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{ if(!ex&&S.i===n-1) return practiceDone(); S.i++; render(); };
  const pv=document.getElementById("prev"); if(pv) pv.onclick=()=>{S.i--;render()};
  ["finish","finish2"].forEach(id=>{const f=document.getElementById(id); if(f) f.onclick=finishExam});
  app.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{S.i=+d.dataset.k;render()});
}

function practiceDone(){
  const n=S.qs.length;
  app.innerHTML=`<section class="panel">
    <div class="eyebrow">${CFG.name} practice complete · ${esc(S.label)}</div>
    <div class="score">${S.correct}/${n}</div>
    <p class="lede">${Math.round(S.correct/n*100)}% correct. Wrong answers are saved to "Retry missed" on this device.</p>
    <div class="row"><button class="btn" id="again">Back to menu</button></div></section>`;
  document.getElementById("again").onclick=home;
}

function finishExam(){
  clearInterval(timer);
  const qs=S.qs, ans=S.ans, P=S.paper;
  let score=0; const by={};
  qs.forEach((q,k)=>{by[q.t]=by[q.t]||[0,0];by[q.t][1]++;if(ans[k]===q.a){score++;by[q.t][0]++;missed.delete(q.id)}else missed.add(q.id)});
  saveMissed();
  if(best[P]==null||score>best[P]){best[P]=score;store(bestKey(P),score)}
  const pass=score>=CFG.pass;
  const wrong=qs.map((q,k)=>({q,k,a:ans[k]})).filter(x=>x.a!==x.q.a);
  app.innerHTML=`
  <section class="panel">
    <div class="eyebrow">${CFG.name} · ${esc(PAPERS[P])} result</div>
    <div class="row" style="gap:16px"><div class="score">${score}/${CFG.n}</div><span class="verdict ${pass?"pass":"fail"}">${pass?"PASS":"NOT YET"}</span></div>
    <p class="lede">${pass?`That would pass the real paper (${CFG.pass} needed).`:`You need ${CFG.pass-score} more to reach the pass mark of ${CFG.pass}.`} ${CFG.tip}</p>
    <table><thead><tr><th>Topic</th><th style="text-align:right">Score</th></tr></thead><tbody>
    ${Object.keys(EXAM).filter(k=>by[k]).map(k=>`<tr><td>${T[k]}</td><td class="n">${by[k][0]} / ${by[k][1]}</td></tr>`).join("")}
    </tbody></table>
    <div class="row"><button class="btn" id="again">Back to menu</button><button class="btn ghost" id="retry">${P===1?"New random paper":"Retake "+esc(PAPERS[P])}</button></div>
  </section>
  ${wrong.length?`<section class="panel review"><h2>Review (${wrong.length})</h2>
  ${wrong.map(x=>`<div class="ritem"><div class="topic">Q${x.k+1} · ${T[x.q.t]}</div><strong>${esc(x.q.q)}</strong>${x.q.img?`<figure class="fig"><img src="${IMG[x.q.img]}" alt="Diagram for this question"></figure>`:""}
    <span class="you">Your answer: ${x.a==null?"none":esc(x.q.o[x.a])}</span>
    <span class="ans">Correct: ${esc(x.q.o[x.q.a])}</span>
    <span class="note">${esc(x.q.e)}</span></div>`).join("")}</section>`:""}`;
  document.getElementById("again").onclick=home;
  document.getElementById("retry").onclick=()=>startExam(P);
}
setLevel(store("radio-level")||"F");
home();
</script>

</body></html>
